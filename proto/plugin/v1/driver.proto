syntax = "proto3";

// Driver-exported methods. Mirrors the hplugin::Driver trait.
// NOTE: schema() (DriverSchema) is not yet modeled; added when needed.
package heph.plugin.v1;

import "plugin/v1/common.proto";
import "plugin/v1/targetdef.proto";
import "plugin/v1/callback.proto";

// Selects which driver RPC the stable-ABI dispatch (`StableManagedDriver::invoke*`)
// should run. Same append-only contract as ProviderMethod. RUN carries the
// native stdio handles (invoke_io). See crates/plugin-stabby/ABI_VERSIONING.md.
enum DriverMethod {
  DRIVER_METHOD_UNSPECIFIED = 0;
  DRIVER_METHOD_PARSE = 1;
  DRIVER_METHOD_APPLY_TRANSITIVE = 2;
  DRIVER_METHOD_RUN = 3; // carries the native stdio (invoke_io)
  DRIVER_METHOD_SCHEMA = 4; // sync metadata (StableMeta::meta)
  DRIVER_METHOD_CONFIG = 5; // sync metadata (StableMeta::meta)
}

message ParseRequest {
  string request_id = 1;
  TargetSpec target_spec = 2;
  // Selects which driver on the plugin handles this (a plugin may expose
  // several named drivers over one connection). Empty => the sole driver.
  string driver = 3;
}
message ParseResponse {
  TargetDef target_def = 1;
}

message ApplyTransitiveRequest {
  string request_id = 1;
  TargetDef target_def = 2;
  Sandbox sandbox = 3;
  string driver = 4;
}
message ApplyTransitiveResponse {
  TargetDef target_def = 1;
}

// Run inputs are materialized dep artifacts — also abstract, so they cross as
// ArtifactHandles; the host materializes them into the sandbox dir.
message RunInput {
  ArtifactHandle artifact = 1;
  string origin_id = 2;
  Addr source_addr = 3;
  repeated string filters = 4;
  map<string, string> annotations = 5;
}

// A scratch cache the host resolved, locked and created for this run. The driver
// symlinks `path` (relative to the target's cwd) at `dir`, and sets `env` to
// `dir`.
//
// `dir` is the canonical slot path, not the in-sandbox mount: tools bake absolute
// paths into their cache entries, so every consumer must see one stable string
// for the same cache or it restores and is inert.
message ScratchMount {
  Addr addr = 1;
  string path = 2;
  string env = 3;
  string dir = 4;
}

// A credential the host resolved, acquired and materialized for this run.
//
// Deliberately the *smallest* thing that can carry an identity. Presentation
// files were written by the host, under `RunRequest.sandbox_dir`, at 0600, and
// are deleted when the run ends whatever its outcome — so they cross as nothing
// at all and the driver never sees material it did not need. What is left is
// what a driver genuinely has to do: set some environment, and (for the Docker
// credential-helper protocol, which resolves a helper by executable name)
// prepend a directory to PATH.
//
// `env` values ARE the material, so they cross inline; there is no other way to
// hand a tool a token it reads from its environment. They carry a hard size
// bound for that reason — see `CREDENTIAL_ENV_MAX_BYTES` — with anything larger
// being a `files` presentation instead.
//
// Unlike a ScratchMount, a mount that fails to decode is an ERROR and never
// dropped: a missing scratch costs a cold cache, whereas a missing credential
// produces a run with no identity that either fails much later somewhere else,
// or succeeds against whatever ambient identity the host happened to have.
message CredentialMount {
  Addr addr = 1;
  // Runtime environment for the target. Never hashed, never `pass_env`.
  map<string, string> env = 2;
  // Directories to prepend to PATH, ahead of the target's own tools.
  repeated string path_prefix = 3;
  // Every material value the driver must scrub from this target's output before
  // it reaches log.txt, the TUI, the failure event or the cache.
  //
  // These are secrets, and they cross even for material presented only as a file
  // — which is the deliberate part. Redacting at render would be too late: the
  // captured log is packed into the cache as an artifact and lifted into the
  // failure event, the JSON output and the CI report, so the only place that
  // covers all of them is the tee, before bytes reach disk. The driver already
  // receives every env-presented value, so the marginal exposure is a file-only
  // credential a build step chose to `cat`.
  repeated string redact = 4;
}

message RunRequest {
  string request_id = 1;
  TargetDef target = 2;
  string tree_root_path = 3;
  repeated RunInput inputs = 4;
  string hashin = 5;
  string sandbox_dir = 6;
  // stdio crosses as inherited fds at spawn, not through the RPC channel;
  // these flags only say whether the host wired each stream.
  bool has_stdin = 7;
  bool has_stdout = 8;
  bool has_stderr = 9;
  // true => run_shell, false => run
  bool shell = 10;
  repeated ScratchMount scratch = 11;
  repeated CredentialMount credentials = 12;
  // Deferred option values the host resolved for this run: the field's raw text
  // (`"${read://infra/aws:role-arn}"`, or a template containing one) mapped to
  // the fully substituted result.
  //
  // Keyed by the raw text rather than by a field path because that is the only
  // thing both ends hold: a driver's `Deferred<T>` carries the text it decoded
  // and knows nothing about where in the config it came from.
  //
  // Never part of any hash. The value's contribution to the cache key already
  // happened, through the producer's `hashout` reaching `hashin` on the ordinary
  // dependency path — the def hash covers the *unresolved* reference, which is
  // what keeps `heph query` and `heph inspect def` from triggering a build.
  map<string, string> deferred = 13;
}

// fuse_slot_guards and sandbox_cleanup are non-transferable host RAII,
// constructed host-side after the remote run returns.
message RunResponse {
  repeated OutputArtifactRef artifacts = 1;
}

// ---- Managed run (driver-support ManagedDriver layer) ----
// The host's ManagedDriverBridge already materialized inputs into the shared
// sandbox dirs, so a managed run carries only paths + metadata — never input
// bytes. The guest executes in the sandbox and returns output artifacts.

enum InputArtifactType {
  INPUT_ARTIFACT_TYPE_UNSPECIFIED = 0;
  INPUT_ARTIFACT_TYPE_DEP = 1;
  INPUT_ARTIFACT_TYPE_SUPPORT = 2;
}

message ManagedRunInput {
  InputArtifactType type = 1;
  string origin_id = 2;
  Addr source_addr = 3;
  repeated string filters = 4;
  map<string, string> annotations = 5;
  // Where this input was unpacked on the shared filesystem.
  string unpack_root = 6;
  // List file for Dep inputs (absent for Support inputs).
  optional string list_path = 7;
}

message ManagedRunRequest {
  string request_id = 1;
  TargetDef target = 2;
  string tree_root_path = 3;
  string hashin = 4;
  string sandbox_dir = 5;
  string sandbox_ws_dir = 6;
  string sandbox_pkg_dir = 7;
  repeated ManagedRunInput inputs = 8;
  // true => run_shell
  bool shell = 9;
  string driver = 10;
  repeated ScratchMount scratch = 11;
  repeated CredentialMount credentials = 12;
  map<string, string> deferred = 13;
}

message ManagedRunResponse {
  repeated OutputArtifactRef artifacts = 1;
}

// ---- Bidi run streams (DriverMethod RUN over StableManagedDriver::invoke_bidi) ----
//
// A driver run is a bidirectional stream. The request stream (host -> driver)
// carries the run request first, then live stdin; the response stream
// (driver -> host) carries live stdout/stderr, then the terminal result. Each
// rides one StreamItem (its `item` is an encoded RunInFrame / RunOutFrame). The
// stdio variants are reserved — unused until live streaming is wired — so adding
// them is an additive, prost-only change (no ABI break).
message RunInFrame {
  oneof msg {
    ManagedRunRequest start = 1; // first item: the run request
    bytes stdin_chunk = 2;       // live stdin bytes
    bool stdin_close = 3;        // stdin EOF (value ignored)
  }
}
message RunOutFrame {
  oneof msg {
    bytes stdout_chunk = 1;
    bytes stderr_chunk = 2;
    ManagedRunResponse response = 3; // terminal: artifacts
    string error = 4;                // terminal: failure message
  }
}
