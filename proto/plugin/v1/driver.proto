syntax = "proto3";

// Driver-exported methods. Mirrors the hplugin::Driver trait.
// NOTE: schema() (DriverSchema) is not yet modeled; added when needed.
package heph.plugin.v1;

import "plugin/v1/common.proto";
import "plugin/v1/targetdef.proto";
import "plugin/v1/callback.proto";

// Selects which driver RPC the stable-ABI dispatch (`StableManagedDriver::invoke*`)
// should run. Same append-only contract as ProviderMethod. RUN carries the
// native stdio handles (invoke_io). See crates/plugin-stabby/ABI_VERSIONING.md.
enum DriverMethod {
  DRIVER_METHOD_UNSPECIFIED = 0;
  DRIVER_METHOD_PARSE = 1;
  DRIVER_METHOD_APPLY_TRANSITIVE = 2;
  DRIVER_METHOD_RUN = 3; // carries the native stdio (invoke_io)
  DRIVER_METHOD_SCHEMA = 4; // sync metadata (StableMeta::meta)
  DRIVER_METHOD_CONFIG = 5; // sync metadata (StableMeta::meta)
  // The exec-runner lane. A driver that answers these also serves the runner
  // for runner targets it built: the host asks it to open a session, to
  // transform each spawn's spec, and to close the session.
  //
  // Additive. A plugin built before these existed simply never answers them,
  // and the host falls back to refusing a runner it cannot open rather than
  // running the target in the wrong environment.
  DRIVER_METHOD_OPEN_SESSION = 6;
  DRIVER_METHOD_PREPARE_SPEC = 7;
  DRIVER_METHOD_CLOSE_SESSION = 8;
}

message ParseRequest {
  string request_id = 1;
  TargetSpec target_spec = 2;
  // Selects which driver on the plugin handles this (a plugin may expose
  // several named drivers over one connection). Empty => the sole driver.
  string driver = 3;
}
message ParseResponse {
  TargetDef target_def = 1;
}

message ApplyTransitiveRequest {
  string request_id = 1;
  TargetDef target_def = 2;
  Sandbox sandbox = 3;
  string driver = 4;
}
message ApplyTransitiveResponse {
  TargetDef target_def = 1;
}

// Run inputs are materialized dep artifacts — also abstract, so they cross as
// ArtifactHandles; the host materializes them into the sandbox dir.
message RunInput {
  ArtifactHandle artifact = 1;
  string origin_id = 2;
  Addr source_addr = 3;
  repeated string filters = 4;
  map<string, string> annotations = 5;
}

message RunRequest {
  string request_id = 1;
  TargetDef target = 2;
  string tree_root_path = 3;
  repeated RunInput inputs = 4;
  string hashin = 5;
  string sandbox_dir = 6;
  // stdio crosses as inherited fds at spawn, not through the RPC channel;
  // these flags only say whether the host wired each stream.
  bool has_stdin = 7;
  bool has_stdout = 8;
  bool has_stderr = 9;
  // true => run_shell, false => run
  bool shell = 10;
}

// fuse_slot_guards and sandbox_cleanup are non-transferable host RAII,
// constructed host-side after the remote run returns.
message RunResponse {
  repeated OutputArtifactRef artifacts = 1;
}

// ---- Managed run (driver-support ManagedDriver layer) ----
// The host's ManagedDriverBridge already materialized inputs into the shared
// sandbox dirs, so a managed run carries only paths + metadata — never input
// bytes. The guest executes in the sandbox and returns output artifacts.

enum InputArtifactType {
  INPUT_ARTIFACT_TYPE_UNSPECIFIED = 0;
  INPUT_ARTIFACT_TYPE_DEP = 1;
  INPUT_ARTIFACT_TYPE_SUPPORT = 2;
}

message ManagedRunInput {
  InputArtifactType type = 1;
  string origin_id = 2;
  Addr source_addr = 3;
  repeated string filters = 4;
  map<string, string> annotations = 5;
  // Where this input was unpacked on the shared filesystem.
  string unpack_root = 6;
  // List file for Dep inputs (absent for Support inputs).
  optional string list_path = 7;
}

message ManagedRunRequest {
  string request_id = 1;
  TargetDef target = 2;
  string tree_root_path = 3;
  string hashin = 4;
  string sandbox_dir = 5;
  string sandbox_ws_dir = 6;
  string sandbox_pkg_dir = 7;
  repeated ManagedRunInput inputs = 8;
  // true => run_shell
  bool shell = 9;
  string driver = 10;

  // ---- Exec runner (docs/EXEC_RUNNERS.md) ----
  // The environment this target's processes must be created in. Absent/empty
  // means the host process itself, which is what every driver did before exec
  // runners existed — so an older guest that never reads these behaves exactly
  // as it always has.
  //
  // A guest that DOES honour them must echo `runner_key` back in
  // `ManagedRunResponse.runner_key`. See that field: the ack is not a courtesy,
  // it is what stops a silently-degraded run from poisoning the shared cache.
  repeated EnvVar runner_env = 11;
  // Identity of the environment, echoed back to prove it was applied.
  string runner_key = 12;
  // Diagnostics: the runner target's address.
  string runner_addr = 13;
}

// An environment variable. `bytes`, not `string`: env values are bytes
// (`Spec.env` is `Vec<(OsString, OsString)>`) and proto3 `string` must be valid
// UTF-8, so a non-UTF-8 `LANG` or store path would be dropped — a silently
// wrong environment — or fail the encode outright.
message EnvVar {
  bytes key = 1;
  bytes value = 2;
}

message ManagedRunResponse {
  repeated OutputArtifactRef artifacts = 1;
  // Echo of `ManagedRunRequest.runner_key`, proving the guest created its
  // processes in the environment the host asked for.
  //
  // The host REFUSES the run when a runner was requested and this does not
  // match. Degrading is the dangerous option: the runner's hashout is folded
  // into the target's `hashin` before the driver ever runs, so a guest that
  // quietly built in the host environment produces an artifact whose key
  // asserts an environment its bytes do not reflect — and that artifact goes to
  // the shared remote cache, where every other machine gets it.
  //
  // An older guest cannot warn about what it ignored: prost drops fields it was
  // not compiled with before guest code runs. So the check has to be the host's,
  // and it has to be on evidence of success rather than absence of complaint.
  string runner_key = 2;
}

// ---- Bidi run streams (DriverMethod RUN over StableManagedDriver::invoke_bidi) ----
//
// A driver run is a bidirectional stream. The request stream (host -> driver)
// carries the run request first, then live stdin; the response stream
// (driver -> host) carries live stdout/stderr, then the terminal result. Each
// rides one StreamItem (its `item` is an encoded RunInFrame / RunOutFrame). The
// stdio variants are reserved — unused until live streaming is wired — so adding
// them is an additive, prost-only change (no ABI break).
message RunInFrame {
  oneof msg {
    ManagedRunRequest start = 1; // first item: the run request
    bytes stdin_chunk = 2;       // live stdin bytes
    bool stdin_close = 3;        // stdin EOF (value ignored)
  }
}
message RunOutFrame {
  oneof msg {
    bytes stdout_chunk = 1;
    bytes stderr_chunk = 2;
    ManagedRunResponse response = 3; // terminal: artifacts
    string error = 4;                // terminal: failure message
  }
}

// ---- Exec-runner lane (DriverMethod OPEN_SESSION / PREPARE_SPEC / CLOSE_SESSION) ----

// One file from the runner target's artifacts. Bytes rather than a path: the
// artifact is content the cache key already covers, and passing bytes keeps the
// guest from reading a filesystem the key knows nothing about.
message RunnerArtifact {
  string path = 1;
  bytes content = 2;
}

message OpenSessionRequest {
  string request_id = 1;
  // Selects which driver on the plugin handles this.
  string driver = 2;
  // Content-addressed identity of this environment — the runner target's
  // hashouts. Two runner targets with byte-identical artifacts are the same
  // environment and share a session.
  string key = 3;
  // The runner target's address, for diagnostics.
  string runner_addr = 4;
  repeated RunnerArtifact artifacts = 5;
}

// How honestly the session describes the environment. `pinned` means the
// environment is described by content the cache key already covers; otherwise a
// stale hit is possible where a pinned environment would have missed, and
// `identity_detail` says why.
message SessionCaps {
  bool pty = 1;
  // Absent = the engine's worker pool is the only cap. Enforced by the host at
  // admission, which is why it has to cross rather than stay in the plugin.
  optional uint32 max_concurrent = 2;
  bool pinned = 3;
  string identity_detail = 4;
}

message OpenSessionResponse {
  // Opaque to the host. Identifies this session on later PREPARE_SPEC /
  // CLOSE_SESSION calls.
  string session_id = 1;
  SessionCaps caps = 2;
  // Names the environment defines as shell functions rather than binaries.
  // Diagnostics only, and the difference between "not found in PATH" and an
  // error naming the actual problem.
  repeated string shell_functions = 3;
  string summary = 4;
  // The environment every process here starts from, or absent when it cannot be
  // enumerated host-side (a container's environment lives inside the
  // container). Callers that report "where did this PATH entry come from" must
  // degrade explicitly rather than print a confident, wrong answer.
  repeated EnvVar base_env = 5;
  bool base_env_known = 6;
}

// The mutable half of a `proc_exec::Spec`.
//
// stdio is deliberately absent: `StdioSpec::Fd` owns a file descriptor, which
// cannot cross a stable boundary, and a runner has no business reassigning the
// host's PTY slave. The kinds below are informational so a runner can tell an
// interactive spawn from a batch one; the host keeps the real stdio and
// re-applies it to whatever comes back.
message ExecSpecPatch {
  bytes program = 1;
  repeated bytes args = 2;
  repeated EnvVar env = 3;
  bytes cwd = 4;
  bool setsid = 5;
  bool ctty = 6;
}

enum StdioKind {
  STDIO_KIND_UNSPECIFIED = 0;
  STDIO_KIND_NULL = 1;
  STDIO_KIND_INHERIT = 2;
  STDIO_KIND_PIPED = 3;
  STDIO_KIND_FD = 4;
}

message PrepareSpecRequest {
  string request_id = 1;
  string driver = 2;
  string session_id = 3;
  ExecSpecPatch spec = 4;
  StdioKind stdin = 5;
  StdioKind stdout = 6;
  StdioKind stderr = 7;
}

message PrepareSpecResponse {
  ExecSpecPatch spec = 1;
}

message CloseSessionRequest {
  string request_id = 1;
  string driver = 2;
  string session_id = 3;
}

message CloseSessionResponse {}
