syntax = "proto3";

// Shared value/address/sandbox types for the heph external-plugin ABI.
// Mirrors the in-process contract types in crates/plugin and crates/model so
// the same logical interface can be carried over proto (UDS), shm (iceoryx2)
// and wasm transports. See crates/plugin-abi/README.md.
package heph.plugin.v1;

// Dynamic config value. Mirrors hcore::htvalue::Value. Kept distinct from
// google.protobuf.Value because heph distinguishes Int/Uint/Float and Null.
message Value {
  message Null {}
  message Map {
    map<string, Value> entries = 1;
  }
  message List {
    repeated Value items = 1;
  }
  oneof kind {
    string string_val = 1;
    bool bool_val = 2;
    double float_val = 3;
    int64 int_val = 4;
    uint64 uint_val = 5;
    Null null_val = 6;
    Map map_val = 7;
    List list_val = 8;
  }
}

// Config handed to a cdylib's create entry (`heph_plugin_create`). Crosses as
// prost bytes (not a stabby struct) so new config fields are additive — an older
// plugin built against fewer fields still loads. `options` is the plugin's
// `options:` map as structured data (no nested encode). `root` is the workspace
// root; `home` is this checkout's own engine home, for plugin state that must
// not be shared between checkouts (in a linked git worktree it is the
// worktree's home, not the main checkout's shared one).
message CreateConfig {
  string root = 1;
  string home = 2;
  map<string, Value> options = 3;
}

// The host's log filter, handed to a plugin (`heph_plugin_set_log_filter`) so it
// can drop events the host would discard before paying to forward them.
//
// A conservative pre-filter, not the host's filter: the host still applies its
// own exact filter to every event it receives, so a plugin that ignores this
// message stays correct, only slower. A host filter this shape cannot express is
// sent as `default_level` = its overall maximum, with no directives. Sent once at
// load, after the log sink; may be sent again, and the latest wins. Until one
// arrives a plugin forwards everything.
//
// Matching, in terms any language can implement: an event with level L and
// target T (an opaque string — a module path, a package import path, ...) is
// forwarded when L is at or below the level of the directive with the longest
// `target_prefix` that is a string prefix of T, or of `default_level` when no
// directive matches.
//   - The prefix test is byte-wise and case-sensitive on UTF-8, and NOT
//     segment-aware: `oci` matches `oci_client`. Do not substitute a dotted
//     logger hierarchy.
//   - An empty `target_prefix` matches every target, and like any directive
//     outranks `default_level`.
//   - Directive order carries no meaning. A prefix that appears more than once
//     takes its most verbose level.
//
// Evolution: every rule above errs towards forwarding, and so must any field
// added later — an old plugin ignores fields it does not know, so a field that
// narrows what is forwarded would make it drop events. A host that cannot
// express a condition sends a wider filter instead.
message LogFilter {
  // A level admits itself and everything less verbose (INFO admits ERROR, WARN
  // and INFO). The order is the one declared below, OFF through TRACE — not the
  // numeric values. A reader treats a value it does not know, and UNSPECIFIED,
  // as TRACE (admit everything), so a missing or newer level never drops an
  // event; a sender must not rely on an old reader understanding a new level.
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_OFF = 1;
    LEVEL_ERROR = 2;
    LEVEL_WARN = 3;
    LEVEL_INFO = 4;
    LEVEL_DEBUG = 5;
    LEVEL_TRACE = 6;
  }
  message Directive {
    string target_prefix = 1;
    Level level = 2;
  }
  Level default_level = 1;
  repeated Directive directives = 2;
}

// Target address. Mirrors hmodel::Addr (package //pkg : name @args).
message Addr {
  string package = 1;
  string name = 2;
  map<string, string> args = 3;
}

// A reference to (an output of) a target. Mirrors driver::TargetAddr.
message TargetAddr {
  Addr ref = 1;
  optional string output = 2;
  repeated string filters = 3;
}

// Provider-emitted state attached to a package. Mirrors provider::State.
message State {
  string package = 1;
  string provider = 2;
  map<string, Value> state = 3;
}

// Query predicate. Mirrors hmodel::Matcher (recursive).
message Matcher {
  message List {
    repeated Matcher matchers = 1;
  }
  oneof kind {
    Addr addr = 1;
    string label = 2;
    string package = 3;
    string package_prefix = 4;
    string tree_output_to = 5;
    List or = 6;
    List and = 7;
    Matcher not = 8;
    // New in 0.13.0. An old host decodes an unknown arm as an empty `Or`;
    // from 0.13.0 on, an unknown arm is a decode error.
    string driver = 9;
  }
}

// ---- Sandbox (driver::sandbox) ----

enum DepMode {
  DEP_MODE_UNSPECIFIED = 0;
  DEP_MODE_NONE = 1;
  DEP_MODE_LINK = 2;
}

message Tool {
  TargetAddr ref = 1;
  string group = 2;
  bool hash = 3;
  string id = 4;
}

message Dep {
  TargetAddr ref = 1;
  DepMode mode = 2;
  string group = 3;
  bool runtime = 4;
  bool hash = 5;
  string id = 6;
}

message Env {
  // EnvValue: literal string, or "pass" (inherit from host env).
  oneof value {
    string literal = 1;
    bool pass = 2; // set true for Pass
  }
  bool hash = 3;
  bool append = 4;
  string append_prefix = 5;
}

message Sandbox {
  repeated Tool tools = 1;
  repeated Dep deps = 2;
  map<string, Env> env = 3;
}
