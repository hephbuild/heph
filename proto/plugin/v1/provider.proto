syntax = "proto3";

// Provider-exported methods. Mirrors the hplugin::Provider trait. BUILD-file
// functions are not a provider's: they belong to the plugin (function.proto).
package heph.plugin.v1;

import "plugin/v1/common.proto";
import "plugin/v1/targetdef.proto";

message ConfigRequest {}
message ConfigResponse {
  string name = 1;
}

// Selects which provider RPC the stable-ABI dispatch (`StableProvider::invoke*`)
// should run. The numeric value is the `method` argument crossing the dylib
// seam. Append-only: a new RPC is a NEW value here + a NEW match arm guest-side;
// the frozen vtable is untouched, so it is an additive (minor) ABI change. Never
// renumber or reuse a value. See crates/plugin-stabby/ABI_VERSIONING.md.
enum ProviderMethod {
  // 0.16.0 moved functions from the provider to the plugin (function.proto):
  // these numbers and names are never reused.
  reserved 5, 6, 8;
  reserved "PROVIDER_METHOD_FUNCTIONS", "PROVIDER_METHOD_CALL_FUNCTION", "PROVIDER_METHOD_SET_FUNCTION_REGISTRY";
  PROVIDER_METHOD_UNSPECIFIED = 0;
  PROVIDER_METHOD_LIST = 1;
  PROVIDER_METHOD_LIST_PACKAGES = 2;
  PROVIDER_METHOD_GET = 3; // carries the native executor (invoke_exec)
  PROVIDER_METHOD_PROBE = 4;
  PROVIDER_METHOD_STATE_SCHEMA = 7;
  PROVIDER_METHOD_CONFIG = 9; // sync metadata (StableMeta::meta)
}

message ListRequest {
  string request_id = 1;
  string package = 2;
  repeated State states = 3;
}
// A set whose presence carries meaning: absent = unknown, present and empty = known empty.
// A bare `repeated` field can't tell the two apart.
message StringSet {
  repeated string values = 1;
}

// What `get` will give this target, when the provider knows it at list time.
// Every field is either unknown (absent) or exact for this listed addr, under the
// state chain `list` received. Only absence means unknown: a present field is
// known, including `has_codegen = false` and an empty `labels` set, so a
// provider leaves a field it does not know unset rather than zero. An empty
// `driver` is the one present value read as unknown.
// Verified by `heph validate`; a listed "no" is trusted by the engine's walks.
message ListedFacts {
  // The spec's labels, compared as a set. Present and empty = no labels.
  StringSet labels = 1;
  // The spec's driver. Absent, "" or over 256 bytes = unknown.
  optional string driver = 2;
  // Whether any path in def.outputs has codegen mode != NONE. Absent = unknown.
  optional bool has_codegen = 3;
}

message ListResponse {
  Addr addr = 1;
  // 0.11.0's per-target labels, superseded by `facts`. Never reuse.
  reserved 2, 3;
  reserved "labels", "labels_known";
  // Absent = every field unknown (an old plugin, or `addr_only`).
  ListedFacts facts = 4;
}

message ListPackagesRequest {
  string prefix = 1;
}
message ListPackageResponse {
  string pkg = 1;
}

// executor is NOT serialized: callbacks travel on the host-callback channel
// (callback.proto), correlated to this request by request_id.
message GetRequest {
  string request_id = 1;
  Addr addr = 2;
  repeated State states = 3;
}
message GetResponse {
  TargetSpec target_spec = 1;
}
// Mirrors provider::GetError { NotFound, Other(_) }.
message GetError {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_NOT_FOUND = 1;
    KIND_OTHER = 2;
    KIND_CYCLE = 3;
    KIND_CANCELLED = 4;
  }
  Kind kind = 1;
  string message = 2;
}

message ProbeRequest {
  string request_id = 1;
  string package = 2;
}
message ProbeResponse {
  repeated State states = 1;
}

// Mirrors hcore::htvalue::signature::ParamType (recursive). Shared by function
// signatures (function.proto) and schemas (below).
message ParamType {
  enum Scalar {
    SCALAR_UNSPECIFIED = 0;
    SCALAR_STRING = 1;
    SCALAR_BOOL = 2;
    SCALAR_INT = 3;
    SCALAR_UINT = 4;
    SCALAR_FLOAT = 5;
    SCALAR_NULL = 6;
  }
  message Union {
    repeated ParamType types = 1;
  }
  // A record with named, heterogeneously-typed fields (e.g. `test`'s struct
  // form). Distinct from `map` (which is homogeneous and arbitrary-keyed).
  message Struct {
    message Field {
      string name = 1;
      ParamType ty = 2;
    }
    repeated Field fields = 1;
  }
  oneof kind {
    Scalar scalar = 1;
    ParamType list = 2; // homogeneous list element type
    ParamType map = 3;  // string-keyed map value type
    Union union = 4;
    Struct struct = 5;  // named heterogeneous fields
  }
}

// ---- Schemas (provider state + driver config) ----
//
// One declarative keyword-arg surface, shared by provider `state_schema()`
// (the args of `provider_state(provider=…, …)`) and driver `schema()` (the
// driver-specific kwargs of a `target(...)`). Consumed by the BUILD-file LSP.

// Mirrors provider::StateField / driver::DriverField.
message SchemaField {
  string name = 1;
  ParamType ty = 2;
  string doc = 3;
  bool required = 4;
}
// Mirrors provider::StateSchema / driver::DriverSchema.
message Schema {
  repeated SchemaField fields = 1;
  // Driver schemas only: does this driver understand deferred values
  // (`${read://pkg:name}` in an option), or must the host refuse them for it?
  //
  // Whole-driver granularity, deliberately. A flat per-field flag cannot describe
  // a reference nested three levels inside a list-of-maps, which is exactly the
  // shape a credential's `sources` has — and per-field safety needs no flag at
  // all, because `String::from_spec_value` reserves the prefixes and so a
  // reference in an ordinary field is a parse error in every driver at once.
  //
  // What is genuinely left is the mixed-version case: a plugin built before this
  // feature carries an old `String` decoder that rejects nothing, decodes
  // "${read://infra:role-arn}" as a literal, and runs the target with the
  // reference text as the value. prost decodes an absent field as `false`, so an
  // old plugin's schema refuses references — loudly, at parse — rather than
  // silently misinterpreting one.
  bool accepts_deferred = 2;
}
