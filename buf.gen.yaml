version: v2
plugins:
  # Views, JSON and reflection are off: nothing reads a `pb` type through any of
  # them, and each would add generated code to every crate that links the ABI.
  - local: protoc-gen-buffa
    out: gen/proto/src
    opt:
      - views=false
  - local: protoc-gen-buffa-packaging
    out: gen/proto/src
    strategy: all
