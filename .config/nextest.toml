# cargo-nextest configuration. `tst` and CI run every test through nextest; see
# the comment on `scripts.tst` in devenv.nix.

# The profile CI selects with `NEXTEST_PROFILE=ci`.
#
# A test still running after 120s is reported as slow, and killed after five
# periods (10 min) with nextest's TIMEOUT status — a hung test becomes a named
# failure instead of a job that runs into its `timeout-minutes` with no clue
# which test it was waiting on.
#
# No retries, on purpose: a flake must show up as a failure, not be absorbed.
[profile.ci]
slow-timeout = { period = "120s", terminate-after = 5 }
retries = 0
fail-fast = false
# Print a failing test's output where it fails and again in the final summary,
# so the cause is at the bottom of a long CI log.
failure-output = "immediate-final"

# Tests that measure the process or the machine and must not share it.
# `failure_memory_slope_bounded` reads peak RSS (`ru_maxrss`) at two points
# and bounds the slope between them. Under the full suite's parallel load on
# the macOS runner, the points moved by tens of KiB per failure, either way
# (`55.3 KiB (1 MiB) vs 27.4 KiB (4 MiB)`), while linux and a local run
# passed: noise from its neighbours, not a leak. So it runs alone: its group
# admits one test at a time, and it takes every test thread, so nothing else
# runs beside it. The bound is not widened.
[test-groups]
alone = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(e2e) & binary(failure_memory) & test(=failure_memory_slope_bounded)'
test-group = 'alone'
threads-required = 'num-test-threads'
