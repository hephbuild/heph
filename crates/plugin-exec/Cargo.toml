[package]
name = "plugin-exec"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
# Substring search for the credential-output scrubber: a needle there is a whole
# session token, so the naive scan it replaced cost ~1000 byte-comparisons per
# output byte on every credentialed target.
memchr = "2.8"
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hplugin = { package = "plugin", path = "../plugin" }
hproc = { package = "proc", path = "../proc" }
hexecrunner = { package = "execrunner", path = "../execrunner" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
glob = "0.3"
tar = "0.4"
libc = "0.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
minijinja = "2"
tracing = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "io-util", "io-std", "process", "macros", "sync", "signal", "fs", "net"] }

[dev-dependencies]
enclose = "1"
serde_yaml = "0.9"
tempfile = "3"
tracing-subscriber = "0.3"
