[package]
name = "builtins"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# `pluginfs::holds_request`, for the in-process e2e suite. Never enabled by a
# binary.
test-support = []

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hwalk = { package = "walk", path = "../walk" }
hplugin = { package = "plugin", path = "../plugin" }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.92"
futures = "0.3.34"
glob = "0.3"
wax = "0.7"
parking_lot = "0.13"
xxhash-rust = { version = "0.8.21", features = ["xxh3", "std"] }
rustc-hash = "2"
xattr = "1"
which = "8.0.6"
tracing = "0.1"
itertools = "0.15.0"
htemplate = { package = "template", path = "../template" }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "io-util", "macros", "sync", "fs", "process"] }
enclose = "1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time"] }
serde_yaml = "0.9"
tempfile = "3"
