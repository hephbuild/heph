[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hconfig = { package = "config", path = "../config" }
hmodel = { package = "model", path = "../model" }
hwalk = { package = "walk", path = "../walk" }
hproc = { package = "proc", path = "../proc" }
hexecrunner = { package = "execrunner", path = "../execrunner" }
hlock = { package = "lock", path = "../lock" }
hsandboxfuse = { package = "sandboxfuse", path = "../sandboxfuse", default-features = false }
hplugin = { package = "plugin", path = "../plugin" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
hdriver-bridge = { package = "driver-bridge", path = "../driver-bridge" }
hbuiltins = { package = "builtins", path = "../builtins" }
hplugin-exec = { package = "plugin-exec", path = "../plugin-exec" }
hplugin-query = { package = "plugin-query", path = "../plugin-query" }
hplugin-stabby = { package = "plugin-stabby", path = "../plugin-stabby", features = ["host"] }
hplugin-abi = { package = "plugin-abi", path = "../plugin-abi", features = ["convert"] }
htelemetry = { package = "telemetry", path = "../telemetry" }
anyhow = "1.0.102"
async-recursion = "1"
async-stream = "0.3"
async-trait = "0.1.89"
borsh = { version = "1.6.1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
enclose = "1"
flate2 = "1.1.9"
futures = "0.3.32"
glob = "0.3"
# GCP auth that understands `external_account` ADC (workload identity
# federation), which object_store's GCS builder cannot decode. Used only to mint
# a bearer token for `gs://` caches whose ADC is external_account; every other
# credential type stays on object_store's native path. `default-features = false`
# drops the id-token backend (pulls aws-lc C build) we don't need; we install the
# ring rustls provider ourselves (see `ensure_rustls_provider_installed`).
google-cloud-auth = { version = "1.13", default-features = false }
indexmap = "2"
memoize = "0.6.0"
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure", "http", "tokio"] }
parking_lot = "0.12"
quick_cache = "0.7"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rayon = "1.12.0"
# Two jobs, one client crate:
#  - `blocking`: downloading `url:` plugin manifests/cdylibs. Blocking runs on
#    its own thread so it is safe to call from inside the async runtime (see
#    plugin_load::download_plugin).
#  - `http2` + `stream`: the client we inject into object_store's store builders
#    so cache transfers negotiate HTTP/2 via ALPN and fall back to HTTP/1.1,
#    instead of object_store's HTTP/1.1-only default that storms connections
#    under a wide fan-out (see remote_cache_objstore::NegotiatingConnector).
# object_store 0.14 moved to reqwest 0.13 — the same major we already use — so
# injecting a client no longer needs a second, renamed copy of reqwest kept in
# lockstep with object_store's internal one (0.13 dropped that duplicate whole
# HTTP+TLS stack from the build). `rustls` avoids a system OpenSSL link and
# carries the platform trust store, matching object_store's own TLS setup. No
# gzip/brotli features → responses are not auto-decompressed (cache blobs stay
# raw).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
rustc-hash = "2"
# Needed only to install a process-wide rustls crypto provider for
# `google-cloud-auth` (its reqwest uses `rustls-no-provider`). `ring` keeps us
# off the aws-lc C toolchain.
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
serde_yaml = "0.9"
similar = "3"
smart-default = "0.7.1"
stacker = "0.1"
tar = "0.4"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "io-util", "io-std", "process", "macros", "sync", "signal", "fs", "test-util", "tracing", "net"] }
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
tracing = "0.1"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
wax = "0.7"
which = "8.0.3"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
thiserror = "2.0.18"
libc = "0.2"
xattr = "1"
tempfile = "3.27"
derivative = "2.2.0"
humantime = "2.3.0"

[dev-dependencies]
hplugin-buildfile = { package = "plugin-buildfile", path = "../plugin-buildfile" }
serde-jsonlines = "0.7.0"
tempfile = "3"
