[package]
name = "config"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# `HomeDir::for_tests`. Enabled by the engine's own `test-support`.
test-support = []

[dependencies]
anyhow = "1.0.102"
hcore = { package = "core", path = "../core" }
memoize = "0.6.0"
# The `.hephconfig` JSON Schema editors validate against: derived from the
# serde types below, so it cannot drift from the parser.
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
tempfile = "3.27"
