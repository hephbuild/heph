[package]
name = "plugin-js"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hwalk = { package = "walk", path = "../walk" }
hplugin = { package = "plugin", path = "../plugin" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1.89"
futures = "0.3.32"
enclose = "1"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
wax = "0.7"
tracing = "0.1"
# Hermetic third-party fetch (`js_install`): download (reqwest), integrity
# verify (sha2/sha1 + base64, SRI format), and extract (flate2 + tar) the
# npm-registry tarball a lockfile entry names. Same versions plugin-go pins
# for the analogous Go SDK/module download path.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
flate2 = "1.1.9"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
