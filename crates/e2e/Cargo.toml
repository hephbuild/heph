[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dev-dependencies]
heph = { path = "../.." }
# `heph::engine::fault_provider`; unifies into the `engine` `heph` links.
hengine = { package = "engine", path = "../engine", features = ["test-support"] }
htestkit = { package = "testkit", path = "../testkit" }
hplugin-oci = { package = "plugin-oci", path = "../plugin-oci" }
# `heph.gh.release_asset` + `gh.extract`, behind the function ABI.
hplugin-gh = { package = "plugin-gh", path = "../plugin-gh" }
serde_yaml = "0.9"
# `make_dyn_provider` + `StableRemoteProvider`: a provider reached the way a
# cdylib is, so a declaring function is exercised across the real ABI codec.
hplugin-sdk = { package = "plugin-sdk", path = "../plugin-sdk", features = [
    "stabby",
] }
hplugin-stabby = { package = "plugin-stabby", path = "../plugin-stabby" }
# The `CreateConfig` bytes a host hands `heph_plugin_create`, so a seam-served
# driver learns the host's capabilities exactly as a cdylib does.
hplugin-abi = { package = "plugin-abi", path = "../plugin-abi", features = [
    "convert",
] }
buffa = { workspace = true }
hplugin = { package = "plugin", path = "../plugin" }
async-trait = "0.1"
hplugin-devenv = { package = "plugin-devenv", path = "../plugin-devenv" }
# `heph.go.build_addr` in-process, for the def-hash pin in `plugin_functions`.
hplugin-go = { package = "plugin-go", path = "../plugin-go" }
hcore = { package = "core", path = "../core" }
# `pluginfs::holds_request`: `fs_glob` checks a request's end drops its memos.
hbuiltins = { package = "builtins", path = "../builtins", features = [
    "test-support",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3"
# `resources::clamp_is_logged_once_per_addr_per_request` captures the engine's
# `info` line with a thread-local subscriber.
tracing-subscriber = "0.3"
anyhow = "1"
tempfile = "3"
# `codegen_index_write::write_back_still_sets_xattr` reads the stamp back;
# `codegen_keep_import` stamps files the way an older heph did.
xattr = "1"
libc = "0.2"
tar = "0.4"
# `oci_image`: inflates a gzipped layer blob to check its `diff_id`.
flate2 = "1.1.11"
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
