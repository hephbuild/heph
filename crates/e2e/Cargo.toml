[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dev-dependencies]
heph = { path = "../.." }
# `heph::engine::fault_provider`; unifies into the `engine` `heph` links.
hengine = { package = "engine", path = "../engine", features = ["test-support"] }
htestkit = { package = "testkit", path = "../testkit" }
hplugin-oci = { package = "plugin-oci", path = "../plugin-oci" }
# `make_dyn_provider` + `StableRemoteProvider`: a provider reached the way a
# cdylib is, so a declaring function is exercised across the real ABI codec.
hplugin-sdk = { package = "plugin-sdk", path = "../plugin-sdk", features = [
    "stabby",
] }
hplugin-stabby = { package = "plugin-stabby", path = "../plugin-stabby" }
hplugin = { package = "plugin", path = "../plugin" }
async-trait = "0.1"
hplugin-devenv = { package = "plugin-devenv", path = "../plugin-devenv" }
hcore = { package = "core", path = "../core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3"
anyhow = "1"
tempfile = "3"
tar = "0.4"
serde_json = "1"
sha2 = "0.10"
