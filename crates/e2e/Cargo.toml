[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dev-dependencies]
heph = { path = "../.." }
htestkit = { package = "testkit", path = "../testkit" }
hplugin-oci = { package = "plugin-oci", path = "../plugin-oci" }
hcore = { package = "core", path = "../core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1"
async-trait = "0.1.89"
tempfile = "3"
tar = "0.4"
serde_json = "1"
sha2 = "0.10"
