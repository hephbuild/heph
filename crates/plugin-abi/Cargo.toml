[package]
name = "plugin-abi"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hproto-gen = { package = "proto-gen", path = "../../gen/proto" }
# The generated code's runtime, already linked through `hproto-gen`; named here
# for `decode`'s options.
buffa = { workspace = true }
anyhow = "1.0.102"
# convert feature: conversions between pb wire types and the in-process
# hplugin/hmodel/hcore types. Optional so the bare wire crate stays light.
hplugin = { package = "plugin", path = "../plugin", optional = true }
hmodel = { package = "model", path = "../model", optional = true }
hcore = { package = "core", path = "../core", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
# A decoder that drops something (a malformed scratch mount) says so.
tracing = { version = "0.1", optional = true }
# The decoder checks a PTY slave's fd is open before it takes ownership of it.
libc = { version = "0.2", optional = true }

[features]
convert = ["dep:hplugin", "dep:hmodel", "dep:hcore", "dep:serde_json", "dep:serde_yaml", "dep:tracing", "dep:libc"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
