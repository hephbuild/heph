[package]
name = "output"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

# Linked into the `heph` binary only, never into a plugin cdylib: it carries
# the only jaq dependency.
[dependencies]
output-derive = { path = "../output-derive" }
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
futures = "0.3.34"
serde = "1"
serde_json = "1.0"
thiserror = "2.0.21"
jaq-core = "3.1.2"
jaq-std = "3.0.4"
jaq-json = "2.0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
