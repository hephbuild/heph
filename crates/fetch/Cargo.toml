[package]
name = "fetch"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
hcore = { package = "core", path = "../core" }
# `Body::chunk`'s item: reqwest's own chunk type, already in reqwest's tree.
bytes = "1.12"
hex = "0.4"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
