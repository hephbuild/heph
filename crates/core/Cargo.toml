[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# `events::test_support`: the cache event stream every consumer's tests fold.
test-support = []

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
wax = "0.7"
futures = "0.3.34"
enclose = "1"
xxhash-rust = { version = "0.8.21", features = ["xxh3", "std"] }
rustc-hash = "2"
stacker = "0.1"
libc = "0.2"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
# `fsutil::TempDir`, a temp dir whose drop removes the read-only trees a
# stage seals (tempfile's own drop cannot).
tempfile = "3"
# A failure slot's `manifest.json` and `diagnostic.json` (`failure_log`), read
# by the engine and the renderers alike. Also what the event stream's
# cross-version decode tests read real JSON frames with.
serde_json = "1"
# `suggest`: the near-miss distance (already in the tree via clap) and the
# NFC form names are compared in.
strsim = "0.11.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
# The paused clock (`start_paused`), for tests only.
tokio = { version = "1.54.1", features = ["test-util"] }
