[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# `events::test_support`: the cache event stream every consumer's tests fold.
test-support = []

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
wax = "0.7"
futures = "0.3.34"
enclose = "1"
xxhash-rust = { version = "0.8.21", features = ["xxh3", "std"] }
rustc-hash = "2"
stacker = "0.1"
libc = "0.2"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# The paused clock (`start_paused`), for tests only.
tokio = { version = "1.54.1", features = ["test-util"] }
# The build-event stream is a live JSON wire format to out-of-process hooks; its
# cross-version decode behaviour is tested against real JSON frames.
serde_json = "1"
