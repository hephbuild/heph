[package]
name = "archive"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
# `StopRead`: cancellation polled on every read of the archive and its entries.
hcore = { package = "core", path = "../core" }
# `Format` and `Limits` are carried in a driver's serialized def.
serde = { version = "1", features = ["derive"] }
# The formats, decoded in-process: no host `tar`/`unzip`, the same code on every
# platform. tar/flate2/zstd are the versions the Go toolchain and the coreutils
# already build; zip takes only its deflate decoder.
tar = "0.4"
flate2 = "1.1.11"
zstd = "0.14"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
