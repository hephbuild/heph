[package]
name = "execrunner"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hproc = { package = "proc", path = "../proc" }
anyhow = "1.0.102"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustix = { version = "1.1", features = ["net", "fs", "process"] }
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
