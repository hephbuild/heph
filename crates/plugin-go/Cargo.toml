[package]
name = "plugin-go"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hwalk = { package = "walk", path = "../walk" }
hproc = { package = "proc", path = "../proc" }
hexecrunner = { package = "execrunner", path = "../execrunner" }
hplugin = { package = "plugin", path = "../plugin" }
hbuiltins = { package = "builtins", path = "../builtins" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
hplugin-exec = { package = "plugin-exec", path = "../plugin-exec" }
hplugin-query = { package = "plugin-query", path = "../plugin-query" }
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
async-recursion = "1"
futures = "0.3.32"
enclose = "1"
parking_lot = "0.12"
borsh = { version = "1.6.1", features = ["derive"] }
glob = "0.3"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "io-util", "process", "macros", "sync", "fs"] }
# Hermetic Go toolchain provisioning: download (reqwest), checksum (sha2),
# and extract (flate2 + tar) the pinned Go SDK tarball so the build never
# reads a `go` binary or GOROOT from the host.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11"
# sha2 0.11 (digest 0.11) returns an `Array` that no longer implements
# `LowerHex`, so the old `format!("{:x}", ..)` is out. `hex::encode` emits the
# same lowercase, unseparated digest, which these checksum comparisons rely on.
hex = "0.4"
flate2 = "1.1.9"
tar = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `hplugin::config::Options` is a map of `serde_yaml::Value`, so building one to
# exercise the provider's option parsing needs the same crate hconfig uses.
serde_yaml = "0.9"
