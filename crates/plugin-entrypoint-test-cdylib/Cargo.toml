[package]
name = "plugin-entrypoint-test-cdylib"
version = "0.1.0"
edition = "2024"
# Test fixture, never shipped: `crates/bin-e2e` loads it through a manifest to
# put an entrypoint-declaring driver behind a REAL `dlopen`. The `e2e` script
# stages it, the `build` job uploads it under a `test-` name that the release's
# `heph*` download pattern does not match.
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
hplugin = { package = "plugin", path = "../plugin" }
hcore = { package = "core", path = "../core" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
plugin-sdk = { path = "../plugin-sdk", features = ["stabby"] }
stabby = "72.1.8"
anyhow = "1.0.102"
async-trait = "0.1"
tracing = "0.1"
