[package]
name = "plugin"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hconfig = { package = "config", path = "../config" }
hmodel = { package = "model", path = "../model" }
htspec-derive = { path = "../htspec-derive" }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
async-trait = "0.1.92"
erased-serde = "0.4"
smart-default = "0.7.1"
itertools = "0.15.0"
futures = "0.3.34"
glob = "0.3"
tokio = { version = "1.54.1", features = ["io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "sync", "rt", "macros"] }
serde_json = "1.0"
tempfile = "3"
