[package]
name = "plugin"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hconfig = { package = "config", path = "../config" }
hmodel = { package = "model", path = "../model" }
hwalk = { package = "walk", path = "../walk" }
htspec-derive = { path = "../htspec-derive" }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1.92"
erased-serde = "0.4"
smart-default = "0.7.1"
itertools = "0.15.0"
futures = "0.3.34"
glob = "0.3"
parking_lot = "0.12"
tokio = { version = "1.54.1", features = ["io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "sync", "rt", "macros"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
