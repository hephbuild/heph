[package]
name = "driver-support"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hplugin = { package = "plugin", path = "../plugin" }
hlock = { package = "lock", path = "../lock" }
anyhow = "1.0.102"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
glob = "0.3"
walkdir = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
tokio = { version = "1.52.3", features = ["rt", "io-util", "fs", "process"] }

# `clonefile(2)` for staged per-file inputs (see `stage::share_file`).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
