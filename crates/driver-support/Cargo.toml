[package]
name = "driver-support"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hplugin = { package = "plugin", path = "../plugin" }
hlock = { package = "lock", path = "../lock" }
# `run_log::RunLog::pump` reads a child's `OutputReader`.
hproc = { package = "proc", path = "../proc" }
anyhow = "1.0.102"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
glob = "0.3"
walkdir = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
tokio = { version = "1.52.3", features = ["rt", "io-util", "fs", "process"] }
# A fresh, uniquely named file per collected output tar (see
# `driver_managed::pack_to_artifact_tar`).
tempfile = "3"
# Substring search for the credential-output scrubber (`redact`): a needle there
# is a whole session token, so the naive scan it replaced cost ~1000
# byte-comparisons per output byte on every credentialed target.
memchr = "2.8"

# `clonefile(2)` for staged per-file inputs (see `stage::share_file`).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The `run_log` pump tests spawn a real child through the exec-runner seam.
hexecrunner = { package = "execrunner", path = "../execrunner" }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time"] }
