[package]
name = "plugin-oci"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hplugin = { package = "plugin", path = "../plugin" }
hproc = { package = "proc", path = "../proc" }
hexecrunner = { package = "execrunner", path = "../execrunner" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
# `sha256_hex_of`, the one streaming file hasher.
hfetch = { package = "fetch", path = "../fetch" }
futures = "0.3.34"
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.92"
xxhash-rust = { version = "0.8.21", features = ["xxh3", "std"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
# Registry transport: the OCI distribution protocol as a library, so `oci_push`
# and `oci_pull` no longer shell out to skopeo. Maintained by the ORAS project.
oci-client = "0.18"
# `oci-client` takes credentials as a value; resolving them from
# `~/.docker/config.json` and the `docker-credential-*` helpers is the caller's
# job — which is what skopeo used to do for us, and what ECR/GCR/ACR need.
docker_credential = "1.4"
bytes = "1.12"
# A layer is pushed as one request body; mapping the file keeps it out of the
# heap (see `registry::blob_body`).
memmap2 = "0.9"
tar = "0.4"
# Layer compression. Called directly rather than through `flate2`, whose
# backend is chosen by feature unification: see `pluginoci/gzip.rs`.
# Pinned exactly: its output is every gzipped layer's digest, so bumping it is
# an `OCI_LAYER_FORMAT_VERSION` bump, with `the_gzipped_blob_digest_is_pinned`
# re-pinned in the same commit.
miniz_oxide = "=0.9.1"
crc32fast = "1.5"
sha2 = "0.11"
# sha2 0.11 (digest 0.11) returns an `Array` that no longer implements
# `LowerHex`; `hex::encode` emits the same lowercase digest.
hex = "0.4"
# The Docker daemon API, for `oci_load`'s `/images/load`.
bollard = "0.21"

[dev-dependencies]
tempfile = "3"
# Decodes what `gzip.rs` writes, with a decoder that is not the encoder.
flate2 = "1.1.11"
# For the test that the `blobs` scratch spec this crate emits actually parses as
# a declaration — the driver that parses it lives there.
hbuiltins = { package = "builtins", path = "../builtins" }
