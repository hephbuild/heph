[package]
name = "vendored-starlark-lsp"
version = "0.14.2"
edition = "2024"
license = "Apache-2.0"
description = "The analysis modules of starlark_lsp 0.14.2, vendored and owned by heph"
publish = false

# Vendored code keeps upstream's style: it is exempt from heph's workspace lint
# policy (see `LINTS_EXEMPT` in tests/root/lint_gate.rs), as `gen/proto` is, so a
# toolchain bump cannot break an `expect` list in code nobody restyles.
[lints.clippy]
all = "allow"

[dependencies]
anyhow = "1.0.65"
derivative = "2.2"
derive_more = { version = "1.0.0", features = ["full"] }
dupe = "0.9.1"
itertools = "0.14.0"
lsp-types = "0.97.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starlark = "0.14.2"
starlark_syntax = "0.14.2"
thiserror = "2.0.18"

[dev-dependencies]
regex = "1.5.4"
textwrap = "0.11"
