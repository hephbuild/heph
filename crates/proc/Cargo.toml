[package]
name = "proc"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
anyhow = "1.0.104"
libc = "0.2"
tracing = "0.1"
crossbeam-channel = "0.5"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "io-util", "process", "macros", "sync", "time", "net"] }

[dev-dependencies]
tempfile = "3"
