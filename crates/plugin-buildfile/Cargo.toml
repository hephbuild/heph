[package]
name = "plugin-buildfile"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Exposes the transport-free LSP loop (`pluginbuildfile::lsp_run`) to the
# editor-shaped harness in `tests/lsp.rs`. Never enabled by a binary.
test-support = []

[dependencies]
hconfig = { package = "config", path = "../config" }
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hwalk = { package = "walk", path = "../walk" }
hproc = { package = "proc", path = "../proc" }
hplugin = { package = "plugin", path = "../plugin" }
hbuiltins = { package = "builtins", path = "../builtins" }
hplugin_query = { package = "plugin-query", path = "../plugin-query" }
hxstarlark_fmt = { package = "xstarlark-fmt", path = "../xstarlark-fmt" }
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
futures = "0.3.32"
enclose = "1"
glob = "0.3"
once_cell = "1"
starlark = "0.14.2"
# The lexer the LSP's site resolver owns a loop around. Its behaviour on
# broken input is pinned by `lexer_probe_table_pinned_to_starlark_syntax_version`,
# so a bump that changes it fails there first.
starlark_syntax = "0.14.2"
strsim = "0.11.1"
allocative = "0.3"
# The LSP owns its loop and vendors starlark_lsp's analysis modules
# (`vendored-starlark-lsp`), so these pins no longer follow starlark's release
# cadence; they stay where the vendored modules were written against
# (`lsp-types` 0.97 is what their `Uri`/`Range` types are) until a deliberate
# bump moves both together.
lsp-server = "0.7"
lsp-types = "0.97"
vendored-starlark-lsp = { path = "../vendored-starlark-lsp" }
tracing = "0.1"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "io-std", "process", "fs"] }

[dev-dependencies]
plugin-buildfile = { path = ".", features = ["test-support"] }
serde_yaml = "0.9"
tempfile = "3"
