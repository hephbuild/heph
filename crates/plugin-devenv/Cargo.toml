[package]
name = "plugin-devenv"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hplugin = { package = "plugin", path = "../plugin" }
hproc = { package = "proc", path = "../proc" }
hdriver-support = { package = "driver-support", path = "../driver-support" }
anyhow = "1.0.104"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["fs"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
