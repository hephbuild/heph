[package]
name = "plugingo-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dev-dependencies]
heph = { path = "../.." }
# go is no longer a heph built-in; the e2e harness constructs it directly.
plugin-go = { path = "../plugin-go" }
htestkit = { package = "testkit", path = "../testkit" }
hcore = { package = "core", path = "../core" }
hmodel = { package = "model", path = "../model" }
hplugin = { package = "plugin", path = "../plugin" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1"
tempfile = "3"
futures = "0.3"
# Reads the program headers of a linked Go binary, to assert its buildmode.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
# Locates the host C compiler the race e2e stages as `//@heph/bin:cc`.
which = "8.0.3"
