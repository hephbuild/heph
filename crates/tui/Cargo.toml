[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# `tui::session::testing`: recordings written without a recorder, for the
# session tests of the root crate and `crates/e2e`.
test-support = []

[dependencies]
hcore = { package = "core", path = "../core" }
htelemetry = { package = "telemetry", path = "../telemetry" }
hproc = { package = "proc", path = "../proc" }
anyhow = "1.0.104"
futures = "0.3.34"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.92"
libc = "0.2"
unicode-width = "0.2"
# The dashboard's address interner: a table of `u32` ids hashed by the
# address they name, so each address is stored once (already in the tree).
hashbrown = { version = "0.17", default-features = false }
ansi-to-tui = "8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "macros", "scrolling-regions"] }
# `osc52`: the dashboard's drag-to-copy writes the clipboard through the
# terminal (its base64 dependency is already in the tree).
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "macros", "sync", "time", "net", "signal"] }
# Session recording (`tui::session`): the record bodies and status snapshot
# in `session.db`, the atomic `inflight.txt` write, and the random half of a
# session id.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `derive(Shape)` on the session types `heph session --json` nests, so the
# field snapshot pins their keys. A proc macro only: no runtime dependency.
output-derive = { path = "../output-derive" }
# The replay's prefilter: only `Log` records are decoded.
memchr = "2"
tempfile = "3"
# A failure's `log:` row quotes the addr and the restore hint its paths, as
# the CI box does (`failure_rows`).
shlex = "2"
uuid = { version = "1.29.3", features = ["v4"] }
# `session.db`, the recording; and its trace id (SHA-256 of the session id).
rusqlite = { version = "0.42", features = ["bundled", "blob"] }
sha2 = "0.11"
hex = "0.4"

# With stdin not a terminal, crossterm reads /dev/tty, and macOS kqueue refuses
# that with EINVAL (measured), so `heph … < file` and `… | heph` timed out on the
# first cursor query. This source polls with select, which accepts it.
[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
hcore = { package = "core", path = "../core", features = ["test-support"] }
