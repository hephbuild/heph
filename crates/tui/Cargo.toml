[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
htelemetry = { package = "telemetry", path = "../telemetry" }
hproc = { package = "proc", path = "../proc" }
anyhow = "1.0.102"
futures = "0.3.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
libc = "0.2"
unicode-width = "0.2"
ansi-to-tui = "8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "macros", "scrolling-regions"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "io-util", "io-std", "macros", "sync", "time", "net", "signal"] }

# With stdin not a terminal, crossterm reads /dev/tty, and macOS kqueue refuses
# that with EINVAL (measured), so `heph … < file` and `… | heph` timed out on the
# first cursor query. This source polls with select, which accepts it.
[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["test-util"] }
