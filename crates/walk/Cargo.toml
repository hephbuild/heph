[package]
name = "walk"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
hconfig = { package = "config", path = "../config" }
wax = "0.7"
borsh = { version = "1.8.1", features = ["derive"] }
# Held at the release r2d2_sqlite is built against: a newer rusqlite is a
# second copy whose `Connection`/`Params` don't unify with the pool's. Every
# other manifest that declares rusqlite points here.
rusqlite = { version = "0.42", features = ["bundled", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"
hsqlite = { package = "sqlite", path = "../sqlite" }
parking_lot = "0.13"
rustc-hash = "2"
xxhash-rust = { version = "0.8.21", features = ["xxh3", "std"] }
tracing = "0.1"
hmodel = { package = "model", path = "../model" }
ignore = "0.4"
unicode-normalization = "0.1.26"
unicode-case-mapping = "1"
# The upgrade's import reads the older heph's provenance stamps. Removed in
# v1.1.0 with the import itself.
xattr = "1"
# The codegen index's overlay: a persistent hash map, so a publish path-copies
# the entries it writes instead of cloning the whole overlay (Decision 22).
rpds = "1"

[dev-dependencies]
tempfile = "3"
