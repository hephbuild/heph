[package]
name = "walk"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
hconfig = { package = "config", path = "../config" }
glob = "0.3"
wax = "0.7"
borsh = { version = "1.6.1", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
hsqlite = { package = "sqlite", path = "../sqlite" }
parking_lot = "0.12"
rustc-hash = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
tracing = "0.1"
hmodel = { package = "model", path = "../model" }
ignore = "0.4"
unicode-normalization = "0.1.26"
unicode-case-mapping = "1"
# The upgrade's import reads the older heph's provenance stamps. Removed in
# v1.1.0 with the import itself.
xattr = "1"
# The codegen index's overlay: a persistent hash map, so a publish path-copies
# the entries it writes instead of cloning the whole overlay (Decision 22).
rpds = "1"

[dev-dependencies]
tempfile = "3"
