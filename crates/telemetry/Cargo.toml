[package]
name = "telemetry"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
hcore = { package = "core", path = "../core" }
hplugin = { package = "plugin", path = "../plugin" }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
# `derive(Shape)` on the enums `heph tool telemetry status --json` prints, so
# the field snapshot pins their values. A proc macro only.
output-derive = { path = "../output-derive" }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4"] }
posthog-rs = "1.3.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tracing = "0.1"
clap = { version = "4.6.9", features = ["derive"] }
# Held at the release r2d2_sqlite is built against (see crates/walk/Cargo.toml).
rusqlite = { version = "0.42", features = ["bundled", "blob"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
hcore = { package = "core", path = "../core", features = ["test-support"] }
