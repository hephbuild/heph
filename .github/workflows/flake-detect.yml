name: Flake detection

# Nightly: run the test suite N times and report per-test failure rates, so a
# flaky test is a number in a table instead of "someone thinks this is
# flaky." Also runs the suite once serially (`--test-threads=1`) and diffs it
# against the N-run parallel aggregate — a test that fails under parallel
# execution but never serially is coupled to process-wide global state, which
# historically caused misattributed flakes (an agent burning time proving
# someone else's flake wasn't theirs).
#
# Advisory by default: it reports, it does not gate `master`. Pass
# `fail_on_flake: true` on a manual dispatch to have it fail instead.
on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of parallel test-suite runs to aggregate"
        required: false
        default: "20"
      fail_on_flake:
        description: "Fail the job if a flaky test is found"
        required: false
        type: boolean
        default: false

concurrency:
  group: flake-detect
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: "2G"
  CARGO_INCREMENTAL: "0"

jobs:
  gen:
    name: Codegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix

      - name: Gen
        shell: devenv shell bash -- -e {0}
        run: gen

      # Scratch hop to the flake-detect job below, not a durable artifact —
      # short retention keeps nightly runs from accumulating full repo
      # checkouts at the default (much longer) retention.
      - name: Upload repo
        uses: actions/upload-artifact@v6
        with:
          name: repo
          path: |
            .
            !.devenv/
          include-hidden-files: true
          retention-days: 1

  flake-detect:
    name: Flake detect ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    # 20 full-suite reruns plus a serial run is a lot more wall-clock than a
    # single `tst` pass (30 min there). This is nightly, not on the PR path,
    # so it can afford to be generous.
    timeout-minutes: 180
    needs: gen
    strategy:
      fail-fast: false
      matrix:
        # linux/arm64 (ubuntu-24.04-arm) is a third target heph.yml tests
        # natively but is deliberately excluded here: this job already
        # multiplies cost by ~20x per platform, and the two flake classes it
        # exists to catch (process-wide global state, macOS-specific timing)
        # don't need a third arch to surface. A silent gap, stated: rerun
        # manually via workflow_dispatch on that runner if arm64-specific
        # flakiness is ever suspected.
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo
          path: .

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix
        with:
          cargo-target: ${{ matrix.target }}
          cache-suffix: "-flake"
          r2-secret: ${{ secrets.CF_SSCACHE }}

      # Prebuilds the flake-report tool (standalone CI tooling — not part of
      # the shipped `heph` binary, see crates/flake-report) and every test
      # binary once; each run in the loop below re-executes these same
      # binaries (cargo no-ops the compile step when nothing changed), so the
      # N-run loop's cost is dominated by actual test execution, not rebuilds.
      - name: Build flake-report + test binaries
        shell: devenv shell bash -- -e {0}
        run: |
          cargo build --locked -p flake-report
          cargo test --locked --workspace --exclude bin-e2e --no-run

      # The two feature-gated `tst` passes (plugin-stabby --features host,
      # plugin-sdk --features stabby) are deliberately excluded from the
      # repeated loop to bound nightly cost — this covers the main suite,
      # where all five flakes attributed in one day actually surfaced.
      - name: Run suite N times (parallel)
        shell: devenv shell bash -- -e {0}
        env:
          RUST_BACKTRACE: "1"
        run: |
          runs="${{ inputs.runs || 20 }}"
          mkdir -p flake-logs
          for i in $(seq 1 "$runs"); do
            echo "=== parallel run $i/$runs ==="
            # Zero-padded so `flake-logs/run-*.log` sorts numerically past 9
            # runs (plain `run-$i.log` would put run-10 before run-2).
            printf -v padded '%03d' "$i"
            cargo test --locked --workspace --exclude bin-e2e \
              > "flake-logs/run-$padded.log" 2>&1 || true
          done

      # One serial run to compare against the N-run parallel aggregate: a
      # test that fails in parallel but passes with --test-threads=1 is
      # coupled to process-wide global state rather than genuinely flaky.
      - name: Run suite once serially
        shell: devenv shell bash -- -e {0}
        env:
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p flake-logs-serial
          cargo test --locked --workspace --exclude bin-e2e -- --test-threads=1 \
            > flake-logs-serial/run-1.log 2>&1 || true

      - name: Aggregate flake report
        id: report
        shell: devenv shell bash -- -e {0}
        run: |
          # `-e` alone doesn't propagate a failing left-hand side through a
          # pipe (the pipeline's exit status is `tee`'s) — without
          # `pipefail`, --fail-on-flake's non-zero exit is swallowed here and
          # the job stays green regardless.
          set -o pipefail
          bin="$CARGO_TARGET_DIR/debug/flake-report"
          extra_args=()
          if [ "${{ inputs.fail_on_flake || false }}" = "true" ]; then
            extra_args+=(--fail-on-flake)
          fi
          "$bin" --logs-dir flake-logs --json-out flake-report.json "${extra_args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Serial-vs-parallel divergence
        shell: devenv shell bash -- -e {0}
        run: |
          bin="$CARGO_TARGET_DIR/debug/flake-report"
          mkdir -p compare
          "$bin" --logs-dir flake-logs-serial --json-out compare/serial.json > /dev/null

          # The parallel side reuses the 20-run aggregate from the previous
          # step instead of a single parallel log: a test that only fails
          # intermittently under parallel execution (say, 1 run in 5) has a
          # good chance of passing in any one sampled run, which would make a
          # single-run comparison miss exactly the divergence this check
          # exists to catch.
          jq -r '.tests[] | select(.failed > 0) | .key' flake-report.json | sort > compare/parallel_failed.txt
          jq -r '.tests[] | select(.failed > 0) | .key' compare/serial.json | sort > compare/serial_failed.txt

          # Fails in the parallel run but not serially: coupled to global state.
          only_parallel="$(comm -23 compare/parallel_failed.txt compare/serial_failed.txt)"
          {
            echo
            echo "## Serial vs parallel divergence"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$only_parallel" ]; then
            n=$(echo "$only_parallel" | wc -l | tr -d ' ')
            {
              echo "$n test(s) fail in parallel but pass with --test-threads=1 (coupled to process-wide global state):"
              echo '```'
              echo "$only_parallel"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Serial/parallel divergence::$n test(s) pass only serially — see step summary"
          else
            echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: sccache stats
        if: always()
        shell: devenv shell bash -- -e {0}
        run: sccache --show-stats

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flake-report-${{ matrix.os }}-${{ matrix.arch }}
          # Superseded by the next nightly run — not worth the default
          # (much longer) retention.
          retention-days: 14
          path: |
            flake-logs/
            flake-logs-serial/
            flake-report.json
            compare/serial.json
