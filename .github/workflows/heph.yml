name: CI

on:
  push:
    branches: ["master"]
  # Every pull request, whatever it targets. Deliberately unfiltered: a
  # `branches:` filter here matches the PR's *base*, so restricting it to
  # master silently gives zero CI to any PR stacked on another branch — no
  # runs queued, no failed checks, nothing to notice. The upper layers of a
  # stack are exactly the changes that most want testing before the layer
  # below them merges.
  #
  # The ABI guard diffs against `github.base_ref` rather than a hardcoded
  # master, so it keeps working here and reports the ABI delta for that layer
  # alone.
  pull_request:

# PR: cancel superseded runs so a new push doesn't leave the old run burning
# runners (and showing up as a noisy "cancelled"). master: every commit gets
# its own group (keyed by sha) so pushes run fully concurrently rather than
# queuing behind each other — the `release` job below is what serializes to
# "latest commit wins".
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# kache config shared by every compiling job. RUSTC_WRAPPER=kache is set by the
# devenv shell; the storage backend (R2, or local disk on fork PRs) and the
# daemon that talks to it are wired up by the setup-nix action. Incremental
# compilation is off because kache caches whole artifacts rather than
# incremental units, and fresh runners have no warm incremental dir to reuse.
#
# KACHE_MAX_SIZE bounds the runner's local store. Well under kache's own 50GiB
# default, which is sized for a workstation: a runner only needs this build's
# artifacts, and on Linux (ext4, no reflink) kache *copies* rather than
# hardlinks the mutable outputs — bin, dylib, cdylib, proc-macro — so those
# cost their bytes twice, once in the store and once in target/. macOS (APFS)
# reflinks them for free. Overshooting here is a disk-full test failure, which
# this repo has hit before, not a slow build.
env:
  KACHE_MAX_SIZE: "10GiB"
  CARGO_INCREMENTAL: "0"

jobs:
  gen:
    name: Codegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      repo_artifact_id: ${{ steps.upload_repo.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix

      - name: Compute version
        id: version
        run: |
          VERSION=$(.github/workflows/version.sh "${{github.run_number}}")
          echo "$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice title=Build Version::$VERSION"

      - name: Gen
        shell: devenv shell bash -- -e {0}
        run: gen

      - name: Upload repo
        id: upload_repo
        uses: actions/upload-artifact@v6
        with:
          name: repo
          path: |
            .
            !.devenv/
          include-hidden-files: true

  # `heph-govet` — the go/analysis unitchecker + formatter binary the go plugin's
  # lint/format targets exec. It is heph's own tool, not the user's: a workspace
  # consuming the plugin has no `tools/heph-govet` to build it from, so it ships
  # as a release asset (`heph-govet_<os>_<arch>`) and the plugin downloads the one
  # published in its own release.
  #
  # Pure Go, so one runner cross-compiles every supported platform in ~a minute.
  # Its per-platform SHA-256s are job outputs: the Rust `build` job bakes them
  # into the plugin (`HEPH_GOVET_SHA256_*`), which then verifies the asset it
  # downloads — no checksum for a user to configure, and a tampered asset fails
  # the build closed. That baking is the only reason `build` needs this job; it
  # deliberately depends on nothing itself (no codegen, no devenv — just the Go
  # sources), so it runs concurrently with `gen` and adds no critical path.
  govet:
    name: Build heph-govet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256_linux_amd64: ${{ steps.build.outputs.sha256_linux_amd64 }}
      sha256_linux_arm64: ${{ steps.build.outputs.sha256_linux_arm64 }}
      sha256_darwin_amd64: ${{ steps.build.outputs.sha256_darwin_amd64 }}
      sha256_darwin_arm64: ${{ steps.build.outputs.sha256_darwin_arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/heph-govet/go.mod
          cache-dependency-path: tools/heph-govet/go.sum

      # Every platform heph supports. The binary runs natively on whichever host
      # lints, so a supported host with no published asset could not lint at all.
      #
      # The four cross-compiles are independent, so they run as parallel steps
      # (`background: true` + `wait-all`) rather than a sequential loop: same
      # runner, four concurrent `go build`s, four separate logs. Each writes its
      # own `<name>.sha256` sidecar instead of appending to `$GITHUB_OUTPUT` —
      # concurrent appends to that file would interleave, and the collector step
      # below turns the sidecars into job outputs once they have all landed.
      - name: Test
        working-directory: tools/heph-govet
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath -buildvcs=false"
        run: go test ./...
        background: true

      - name: Build linux/amd64
        working-directory: tools/heph-govet
        env:
          # Reproducible-ish and lean: no VCS stamping, no debug info. The binary
          # carries no version — the release tag it is published under is its
          # identity, and the plugin pins that tag.
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath -buildvcs=false"
          GOOS: linux
          GOARCH: amd64
        run: "$GITHUB_WORKSPACE/.github/workflows/govet-build.sh"
        background: true

      - name: Build linux/arm64
        working-directory: tools/heph-govet
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath -buildvcs=false"
          GOOS: linux
          GOARCH: arm64
        run: "$GITHUB_WORKSPACE/.github/workflows/govet-build.sh"
        background: true

      - name: Build darwin/amd64
        working-directory: tools/heph-govet
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath -buildvcs=false"
          GOOS: darwin
          GOARCH: amd64
        run: "$GITHUB_WORKSPACE/.github/workflows/govet-build.sh"
        background: true

      - name: Build darwin/arm64
        working-directory: tools/heph-govet
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath -buildvcs=false"
          GOOS: darwin
          GOARCH: arm64
        run: "$GITHUB_WORKSPACE/.github/workflows/govet-build.sh"
        background: true

      # Barrier: every build (and the test run) must land before the checksums are
      # collected and the artifacts uploaded.
      - wait-all:

      - name: Collect checksums
        id: build
        run: |
          for f in dist/*.sha256; do
            name=$(basename "$f" .sha256)          # heph-govet_<goos>_<goarch>
            sha=$(cat "$f")
            echo "$name $sha"
            echo "sha256_${name#heph-govet_}=$sha" >> $GITHUB_OUTPUT
          done

      # Named `heph-govet_*`, so the `heph*` download pattern in `upload_artifacts`
      # picks them up and publishes them as release assets alongside the rest. The
      # `.sha256` sidecars are internal to this job and are not published.
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: heph-govet
          # Only the binaries become release assets; the `.sha256` sidecars are
          # internal to this job.
          path: |
            dist/heph-govet_*
            !dist/*.sha256

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    needs: [gen, govet]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64 (Native)
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux ARM64 (Cross-compiled on AMD64 runner)
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # macOS AMD64 (Intel natively runs on macos-13)
          # This costs money...
#          - os: darwin
#            arch: amd64
#            runs-on: macos-latest-large
#            target: x86_64-apple-darwin

          # macOS ARM64 (Apple Silicon natively runs on macos-latest)
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo
          path: .

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix
        with:
          cargo-target: ${{ matrix.target }}
          r2-secret: ${{ secrets.CF_SSCACHE }}

      - name: Build
        id: build
        shell: devenv shell bash -- -e {0}
        env:
          BIN_NAME: "heph_${{ matrix.os }}_${{ matrix.arch }}"
          # Checksums of the heph-govet assets this same run publishes. Baked into
          # the go plugin so it verifies the binary it downloads at build time
          # (see crates/plugin-go/src/plugingo/govet.rs). All platforms are baked
          # into every build: the plugin picks the one matching the host it later
          # runs on.
          HEPH_GOVET_SHA256_LINUX_AMD64: "${{needs.govet.outputs.sha256_linux_amd64}}"
          HEPH_GOVET_SHA256_LINUX_ARM64: "${{needs.govet.outputs.sha256_linux_arm64}}"
          HEPH_GOVET_SHA256_DARWIN_AMD64: "${{needs.govet.outputs.sha256_darwin_amd64}}"
          HEPH_GOVET_SHA256_DARWIN_ARM64: "${{needs.govet.outputs.sha256_darwin_arm64}}"
        run: |
          # Go plugin cdylib carries its native extension (.so on Linux, .dylib on
          # macOS); the distribution manifest records each artifact's URL
          # explicitly, so no uniform suffix is needed.
          if [ "${{ matrix.os }}" = "darwin" ]; then ext=dylib; else ext=so; fi
          PLUGIN_GO_NAME="heph-go-plugin_${{ matrix.os }}_${{ matrix.arch }}.$ext"
          PLUGIN_GHA_NAME="heph-gha-plugin_${{ matrix.os }}_${{ matrix.arch }}.$ext"
          PLUGIN_OCI_NAME="heph-oci-plugin_${{ matrix.os }}_${{ matrix.arch }}.$ext"
          # heph-bench: the perf-regression harness (`perfbench` job). Publishing
          # it as a release asset alongside `heph` itself means that job never
          # builds anything to compare a PR against its baseline — both the
          # binary under test AND the tool measuring it come from a release, for
          # N (this build) and N-1 (a past release) alike.
          BENCH_BIN_NAME="heph-bench_${{ matrix.os }}_${{ matrix.arch }}"
          # `heph`'s two release flavours, from the ONE compile below: `$OUT/heph`
          # keeps the profile's DWARF line tables (published, flavour-stamped, as
          # $DEBUG_BIN_NAME), and $BIN_NAME (the default "std" flavour, what
          # `versionFlavour: debug` in `.hephconfig` opts out of) is a `strip`-ped,
          # flavour-stamped copy of it. No second compile — see the comment on
          # `[profile.release]` in the root Cargo.toml for why.
          DEBUG_BIN_NAME="heph_debug_${{ matrix.os }}_${{ matrix.arch }}"
          echo "bin_name=$BIN_NAME" >> $GITHUB_OUTPUT
          echo "plugin_go_name=$PLUGIN_GO_NAME" >> $GITHUB_OUTPUT
          echo "plugin_gha_name=$PLUGIN_GHA_NAME" >> $GITHUB_OUTPUT
          echo "plugin_oci_name=$PLUGIN_OCI_NAME" >> $GITHUB_OUTPUT
          echo "bench_bin_name=$BENCH_BIN_NAME" >> $GITHUB_OUTPUT
          echo "debug_bin_name=$DEBUG_BIN_NAME" >> $GITHUB_OUTPUT
          OUT="target/${{ matrix.target }}/release"
          # FUSE (default feature) on Linux is pure-Rust (no libfuse link), so
          # zigbuild cross-compiles cleanly. On macOS it links libfuse via the
          # devenv macfuse-stubs; zig mangles the nix `-L` path under its SDK
          # syslibroot and fails to find `-lfuse`, so the (native arm64) macOS
          # runner uses plain `cargo build` — no cross needed there.
          #
          # Both Linux targets go through zigbuild even though amd64 runs on a
          # native runner (and arm64 could now, since the test job uses
          # ubuntu-24.04-arm). This is about the glibc floor, not the host arch:
          # zigbuild pins it independent of the runner image — the shipped
          # binaries need at most GLIBC_2.30 — where a native build on
          # ubuntu-24.04 would link 2.39 and stop running on RHEL 9 (2.34),
          # Debian 12 (2.36), Ubuntu 22.04 (2.35) and Amazon Linux 2023 (2.34).
          # Do not "simplify" this to a native cargo build.
          #
          # The heph bin and the plugin cdylibs build in ONE invocation. They
          # share nearly the whole workspace dep graph, and under the release
          # profile (thin-LTO + opt-level=3) each artifact's final codegen/LTO pass
          # is heavy — splitting into separate `cargo build` calls serializes those
          # three passes and pays cargo startup + freshness re-resolution each time.
          # A single invocation lets cargo's jobserver overlap them (one artifact's
          # link tail filling cores while the next codegens). `--bin heph` selects
          # the binary; `--lib` adds every selected package's lib target — i.e. both
          # cdylibs (heph's own lib is already built as the bin's dependency, so it
          # costs nothing extra). `heph-bench` links the same `heph` lib crate, so
          # adding it here is marginal — the expensive part (engine + deps) is
          # already being compiled for `heph` itself.
          TARGETS="--bin heph --bin heph-bench --lib -p heph -p plugin-go-cdylib -p plugin-gha-cdylib -p plugin-oci-cdylib -p bench"
          if [ "${{ matrix.os }}" = "darwin" ]; then
            cargo build --release --locked --target ${{ matrix.target }} $TARGETS
            lib="$OUT/libplugin_go_cdylib.dylib"
            gha_lib="$OUT/libplugin_gha_cdylib.dylib"
            oci_lib="$OUT/libplugin_oci_cdylib.dylib"
            # The nix toolchain hard-links libiconv against its /nix/store path,
            # which is absent on user machines (dyld aborts at launch). Rewrite
            # those load commands to the OS /usr/lib copies — for every artifact.
            bash scripts/macos-portable.sh "$OUT/heph"
            bash scripts/macos-portable.sh "$OUT/heph-bench"
            bash scripts/macos-portable.sh "$lib"
            bash scripts/macos-portable.sh "$gha_lib"
            bash scripts/macos-portable.sh "$oci_lib"
          else
            cargo zigbuild --release --locked --target ${{ matrix.target }} $TARGETS
            lib="$OUT/libplugin_go_cdylib.so"
            gha_lib="$OUT/libplugin_gha_cdylib.so"
            oci_lib="$OUT/libplugin_oci_cdylib.so"
          fi
          cp "$OUT/heph-bench" $BENCH_BIN_NAME
          cp "$lib" $PLUGIN_GO_NAME
          cp "$gha_lib" $PLUGIN_GHA_NAME
          cp "$oci_lib" $PLUGIN_OCI_NAME

          # The build version, stamped into every artifact below rather than
          # compiled in. Deliberately a plain shell variable and NOT exported:
          # it must not be visible to rustc. kache keys a compile on the
          # `option_env!` values rustc reports, and this string folds in
          # `git describe` and the run number — so exporting it and reading it
          # back at compile time is what used to invalidate `core`, and with it
          # every first-party crate and link above it, on every single push.
          # See `VERSION_SLOT_LEN` in crates/core/src/version.rs.
          VERSION='${{needs.gen.outputs.version}}'

          # Every shipped artifact gets the version, not just `heph`: they all
          # link `hcore`, so they all carry the slot, and an unstamped one
          # reports `v0.0.0-dev` — which self-upgrade reads as "this is a dev
          # build, never upgrade". The go plugin additionally derives its
          # default govet target address from the version, so a dev-stamped
          # cdylib would resolve the wrong address at runtime.
          for artifact in \
            $BENCH_BIN_NAME $PLUGIN_GO_NAME $PLUGIN_GHA_NAME $PLUGIN_OCI_NAME
          do
            bash scripts/patch-slot.sh "$artifact" "version=$VERSION"
          done

          # `heph` diverges into its two flavours from here — each stamped by
          # `patch-slot.sh` with which one it is (`heph version` / self-upgrade
          # read that back via `hcore::version::flavour()`), since nothing at
          # compile time can tell them apart (see the comment above `OUT/heph`).
          # Both slots in one call so macOS is re-signed once, after the last
          # write, rather than once per slot.
          cp "$OUT/heph" $DEBUG_BIN_NAME
          bash scripts/patch-slot.sh $DEBUG_BIN_NAME "version=$VERSION" flavour=debug

          # "std" flavour: strip a copy of the same compiled `heph` — no second
          # compile. `rust-strip` (cargo-binutils' wrapper around the
          # `llvm-tools` component's llvm-objcopy, added in devenv.nix) rather
          # than host `strip`/binutils: it's LLVM-based and target-agnostic,
          # so it handles the Linux arm64 leg's cross-compiled output from an
          # amd64 runner (see the zigbuild comment above) where a native
          # `strip` typically can't touch a foreign-arch ELF. `zig objcopy`
          # was tried first — already in this shell for zigbuild — but its
          # `--strip-all` hit an unimplemented code path on real release
          # output (verified in CI, not just locally).
          #
          # Stamped *after* stripping, not before: `rust-strip` rewrites the
          # file, and the slots are ordinary `.rodata` that survive it — but
          # patching first would mean re-signing first, and stripping would then
          # invalidate that signature again on darwin.
          cp "$OUT/heph" $BIN_NAME
          rust-strip --strip-all $BIN_NAME
          bash scripts/patch-slot.sh $BIN_NAME "version=$VERSION" flavour=

      # Runs wherever this runner can actually execute what it just built: the
      # darwin leg and the linux/amd64 leg both build for the runner's own
      # arch. linux/arm64 cross-compiles on an amd64 runner (see the zigbuild
      # comment above) — nothing here can execute that binary; the `bin_e2e`
      # job launches it for real on a native arm64 runner instead. On darwin
      # specifically this also proves the weak-linked libfuse binary still
      # launches without macFUSE installed (dyld would abort here if it were
      # hard-linked).
      - name: Smoke test launch
        if: matrix.os == 'darwin' || matrix.arch == 'amd64'
        run: |
          ./$BIN_NAME version
          ./$BENCH_BIN_NAME --help
          # Both flavours launch, and each reports the flavour patch-slot.sh
          # actually stamped — not just that the binary runs at all. The
          # baked-in version already carries its own build metadata (a commit
          # hash), so check for the debug flavour marker specifically, not
          # "any build metadata at all" (`hcore::version::reported` joins the
          # flavour onto the existing metadata with a `.`, or a bare `+` if
          # there wasn't any — either way it ends in `.debug` or `+debug`).
          std_version="$(./$BIN_NAME version)"
          debug_version="$(./$DEBUG_BIN_NAME version)"
          echo "std: $std_version"
          echo "debug: $debug_version"
          case "$std_version" in *+debug|*.debug) echo "std flavour must not report the debug flavour: $std_version" >&2; exit 1 ;; esac
          case "$debug_version" in *+debug|*.debug) ;; *) echo "debug flavour did not report itself: $debug_version" >&2; exit 1 ;; esac

          # The version slot actually took. This is the failure the slot
          # mechanism introduces and nothing else would catch: the version is no
          # longer compiled in, so if `patch-slot.sh` were dropped, silently
          # matched nothing, or ran before a step that rewrites the file, every
          # artifact would still build, still launch, still pass every other
          # check — and ship reporting `v0.0.0-dev`, which self-upgrade treats as
          # a dev build and never upgrades. Assert the real version instead.
          for reported in "$std_version" "$debug_version"; do
            case "$reported" in
              *v0.0.0-dev*)
                echo "version slot was never stamped — reports the dev sentinel: $reported" >&2
                exit 1 ;;
            esac
          done
          case "$std_version" in
            *"$EXPECTED_VERSION"*) ;;
            *) echo "expected version '$EXPECTED_VERSION', got: $std_version" >&2; exit 1 ;;
          esac
        env:
          BIN_NAME: "heph_${{ matrix.os }}_${{ matrix.arch }}"
          BENCH_BIN_NAME: "heph-bench_${{ matrix.os }}_${{ matrix.arch }}"
          DEBUG_BIN_NAME: "heph_debug_${{ matrix.os }}_${{ matrix.arch }}"
          EXPECTED_VERSION: "${{needs.gen.outputs.version}}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.build.outputs.bin_name}}
          path: ${{steps.build.outputs.bin_name}}

      - name: Upload debug flavour artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.build.outputs.debug_bin_name}}
          path: ${{steps.build.outputs.debug_bin_name}}

      - name: Upload heph-bench artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.build.outputs.bench_bin_name}}
          path: ${{steps.build.outputs.bench_bin_name}}

      - name: Upload go plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.build.outputs.plugin_go_name}}
          path: ${{steps.build.outputs.plugin_go_name}}

      - name: Upload gha plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.build.outputs.plugin_gha_name}}
          path: ${{steps.build.outputs.plugin_gha_name}}

      - name: Upload oci plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.build.outputs.plugin_oci_name}}
          path: ${{steps.build.outputs.plugin_oci_name}}

      # Last, deliberately. This is the only job with steps after its compile,
      # and the drain must not sit in front of them: it would still be correct
      # today (nothing after `Build` compiles) but only by accident, and a
      # compiling step appended later would silently stop being published.
      - name: kache stats + drain uploads
        if: always()
        shell: devenv shell bash -- -e {0}
        run: |
          kache stats

          # Resolve the log path from the daemon itself rather than hardcoding
          # it. Both OSes run this same step and they do not agree: Linux puts
          # it at `~/.cache/kache/kache.log`, macOS at
          # `~/Library/Logs/kache/kache.log` — note *Logs*, not the `Caches`
          # directory the upstream docs name, which is where hardcoding it
          # would have silently produced nothing on the darwin legs.
          log=$(kache daemon 2>/dev/null | awk '/^[[:space:]]*Logs:/ {print $2; exit}') || true

          kache daemon stop || true

          # Upload outcomes exist *only* in this log. `kache stats` reports what
          # was read, never what was published, so without this the difference
          # between "uploaded" and "still queued when the 30s drain cap fired"
          # is invisible — which is precisely the question a low hit rate on a
          # re-run raises, and which cost a round trip to answer once already.
          if [ -n "${log:-}" ] && [ -f "$log" ]; then
            echo "::group::kache daemon log (tail)"
            tail -n 200 "$log"
            echo "::endgroup::"
          else
            echo "::warning title=kache::daemon log not found at '${log:-<unresolved>}' — upload outcomes are not diagnosable for this job"
          fi

  upload_artifacts:
    name: Pre-release
    needs: [gen, govet, build]
    if: always() && needs.gen.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_url: ${{ steps.create_release.outputs.url }}
    steps:
      # Checkout brings tools/pluginmanifest (the manifest generator); the built
      # artifacts download into dist/ alongside it.
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          # pluginmanifest has no external deps (no go.sum) — nothing to cache,
          # and the default cache lookup warns about a missing root go.mod.
          cache: false

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          # Matches the CLI, both release flavours (`heph_<os>_<arch>` std,
          # `heph_debug_<os>_<arch>` debug) and the go plugin cdylib
          # (`heph-go-plugin_<os>_<arch>.{so,dylib}`); excludes the `repo` source artifact.
          pattern: "heph*"
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lahR dist

      # Build the go plugin distribution manifest from the per-os/arch cdylibs in
      # dist/ — one entry per artifact, its `url` the release-asset URL it's
      # published alongside (so `plugins: - { identifier: { url: .../heph-go-plugin.json } }`
      # resolves the right dylib for the host). Each entry carries the artifact's
      # `sha256:` checksum; a `<manifest>.sha256` sidecar (published too) holds the
      # manifest's own checksum for consumers to pin as `plugins[].checksum`.
      # JSON via tools/pluginmanifest.
      - name: Generate plugin manifests
        run: |
          VERSION="${{needs.gen.outputs.version}}"
          BASE="https://github.com/hephbuild/heph-artifacts-v1/releases/download/$VERSION"
          ( cd tools/pluginmanifest && go run . -name go -version "$VERSION" \
              -prefix heph-go-plugin -from-dir "$GITHUB_WORKSPACE/dist" -url-base "$BASE" \
              -out "$GITHUB_WORKSPACE/dist/heph-go-plugin.json" )
          cat dist/heph-go-plugin.json
          echo "manifest checksum: $(cat dist/heph-go-plugin.json.sha256)"
          # The gha hook plugin ships the same way: one manifest entry per
          # per-os/arch cdylib in dist/, published as a release asset.
          ( cd tools/pluginmanifest && go run . -name gha -version "$VERSION" \
              -prefix heph-gha-plugin -from-dir "$GITHUB_WORKSPACE/dist" -url-base "$BASE" \
              -out "$GITHUB_WORKSPACE/dist/heph-gha-plugin.json" )
          cat dist/heph-gha-plugin.json
          echo "manifest checksum: $(cat dist/heph-gha-plugin.json.sha256)"
          # The oci plugin (`docker_build` / `oci_pull` / `oci_push` / `oci_load`)
          # ships the same way — it is not compiled into the CLI.
          ( cd tools/pluginmanifest && go run . -name oci -version "$VERSION" \
              -prefix heph-oci-plugin -from-dir "$GITHUB_WORKSPACE/dist" -url-base "$BASE" \
              -out "$GITHUB_WORKSPACE/dist/heph-oci-plugin.json" )
          cat dist/heph-oci-plugin.json
          echo "manifest checksum: $(cat dist/heph-oci-plugin.json.sha256)"

      - name: Create Release in artifacts repo
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          repository: hephbuild/heph-artifacts-v1
          token: ${{ secrets.HEPH_ARTIFACTS_PAT }}
          tag_name: ${{needs.gen.outputs.version}}
          name: Build ${{needs.gen.outputs.version}}
          body: "Artifacts automatically published from source-repo (rust)."
          draft: false
          prerelease: true
          files: dist/*

  abi:
    name: ABI guard
    # PR-only: it diffs the branch against the PR base. Pure git + bash, so it
    # skips the devenv toolchain and runs in seconds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so merge-base with the PR base resolves.
          fetch-depth: 0
      - name: Check plugin ABI version
        run: scripts/abi-check.sh "origin/${{ github.base_ref }}"

  # The gate check-builds every workspace member's libs *and* test targets,
  # three times (default features, --all-features, --no-default-features),
  # where it used to build the root package alone in ~1m35s. A fork PR gets no
  # R2 credentials and runs every pass stone cold, so the headroom is sized for
  # that case. Under sccache this job was uncacheable on top of that — it did
  # not cache `clippy-driver` at all, which is why these legs used to report
  # ~200 "non-cacheable calls". kache does: cargo runs workspace members as
  # `$RUSTC_WRAPPER $RUSTC_WORKSPACE_WRAPPER $RUSTC`, so the wrapper sees the
  # clippy invocation and keys it on clippy-driver's own compiler identity,
  # separately from the equivalent `cargo build` unit. Measured on a workspace
  # member: `cargo clean -p <crate>` then `cargo clippy -p <crate>
  # --all-targets` restores from cache rather than re-linting.
  #
  # A timeout renders as a red lint leg indistinguishable from a real lint
  # failure, so the 30min headroom is deliberate.
  #
  # Both platforms, because macOS-only code was clippy-linted nowhere.
  # `Test darwin/arm64` compiles it, but nothing there passes `-D warnings`, so
  # the Mach `sweep_threads` block in `src/diag.rs` — the largest unsafe region
  # in the tree — plus `crates/proc/src/proc_exec/imp_macos.rs` and
  # `process_watcher/kqueue_macos.rs` had never been through
  # `undocumented_unsafe_blocks`, `multiple_unsafe_ops_per_block`,
  # `indexing_slicing` or `unwrap_used`.
  #
  # Every leg runs the *same* `lint` script — no per-OS variant. The failure
  # being closed is a Mac developer's local `lint` disagreeing with CI in either
  # direction (`#[expect]` is fulfilled-or-error, so a lint that fires on one OS
  # and not the other is a hard error on the other), and that only stays closed
  # if every leg runs the same command as the developer does.
  #
  # This is a matrix, so the published status contexts are the *rendered* names,
  # one per leg — `Lint linux/amd64` and `Lint darwin/arm64`. There is no longer
  # any context named plain `Lint`. Branch protection must require the two new
  # names; until it does, a red lint does not block a merge. (Verified from a
  # real run of this matrix, not inferred: GitHub publishes the rendered name,
  # with no parenthesised matrix suffix.)
  #
  # `needs: lint` elsewhere in this file waits for *every* leg and is skipped if
  # any of them fails — the same fan-in the `build` matrix already relies on via
  # `bin_e2e`'s `needs: [gen, build, …]`. Downstream gating therefore needs no
  # aggregator job.
  #
  # No `continue-on-error:` and no `if:` on the Lint step, ever. Either one lets
  # a leg conclude `success` with clippy never having run, which makes the leg's
  # own check green — and, because `needs` treats a successful job as satisfied,
  # lets `release` proceed over a platform that was not linted. It is the one
  # remaining way to reach a silent pass here, and it is invisible in the check
  # list. `tests/lint_gate.rs` asserts their absence.
  #
  # Cost, measured rather than assumed — see the PR body. The darwin leg is a
  # fourth concurrent `macos-latest` job in the `needs: gen` wave, which is the
  # real price rather than the minutes: the darwin build chain has been observed
  # on the critical path, and macOS jobs in this repo have queued up to ~2m30s
  # waiting for a slot. macOS also starts colder — the Nix setup alone measures
  # 3m15s-4m42s there, and the cargo registry cache is restore-only on PRs
  # (only master saves), so the darwin leg stays near its cold ~10min until this
  # key is populated from master.
  lint:
    name: Lint ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    needs: gen
    strategy:
      # Both legs always report. With fail-fast the second is cancelled the
      # moment the first goes red, and `cancelled` is exactly the state that
      # tells you nothing about the platform you did not see.
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # macos-latest is Apple Silicon. There is no `Lint linux/arm64` leg:
          # aarch64 is covered here on the OS axis, and an `#[expect]` that is
          # unfulfilled only on aarch64-linux would be invisible anyway — plain
          # rustc silently ignores an unfulfilled expectation on a *tool* lint
          # it does not know, so `Test linux/arm64` cannot stand in for one.
          # See the note in devenv.nix.
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo
          path: .

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix
        with:
          cargo-target: ${{ matrix.target }}
          # Distinct from the build and test jobs, which use the same target
          # triples: actions/cache skips the save when the exact key already
          # exists, so two jobs sharing a key means whichever saves first
          # freezes the entry and the other's crate downloads never persist.
          cache-suffix: "-lint"
          r2-secret: ${{ secrets.CF_SSCACHE }}

      - name: Lint
        shell: devenv shell bash -- -e {0}
        run: lint

      # Also the upload barrier, which is why it is `always()` and why every
      # compiling job needs one. The daemon uploads to R2 in the background so
      # no rustc invocation waits on the network — but an ephemeral runner is
      # torn down the moment the job ends, taking any queued upload with it.
      # `daemon stop` drains the queue (up to 30s) before returning, so what
      # this job compiled is actually published. Without it the cache still
      # reads correctly, it just never fills.
      #
      # `|| true`: fork PRs run with no remote and therefore no daemon (see
      # setup-nix), and this must not turn a green build red on the way out.
      - name: kache stats + drain uploads
        if: always()
        shell: devenv shell bash -- -e {0}
        run: |
          kache stats

          # Resolve the log path from the daemon itself rather than hardcoding
          # it. Both OSes run this same step and they do not agree: Linux puts
          # it at `~/.cache/kache/kache.log`, macOS at
          # `~/Library/Logs/kache/kache.log` — note *Logs*, not the `Caches`
          # directory the upstream docs name, which is where hardcoding it
          # would have silently produced nothing on the darwin legs.
          log=$(kache daemon 2>/dev/null | awk '/^[[:space:]]*Logs:/ {print $2; exit}') || true

          kache daemon stop || true

          # Upload outcomes exist *only* in this log. `kache stats` reports what
          # was read, never what was published, so without this the difference
          # between "uploaded" and "still queued when the 30s drain cap fired"
          # is invisible — which is precisely the question a low hit rate on a
          # re-run raises, and which cost a round trip to answer once already.
          if [ -n "${log:-}" ] && [ -f "$log" ]; then
            echo "::group::kache daemon log (tail)"
            tail -n 200 "$log"
            echo "::endgroup::"
          else
            echo "::warning title=kache::daemon log not found at '${log:-<unresolved>}' — upload outcomes are not diagnosable for this job"
          fi

  test:
    name: Test ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    # 30 was sized when the macOS leg silently skipped every Go test (`go` was
    # absent from the runner and `require_go!` returned Ok — the whole go-plugin
    # suite "passed" in under a second). Now that devenv supplies a Go, darwin
    # does the work it was always meant to: 480 `plugin-go` unit tests in 150s,
    # ~11min of `plugingo-e2e` on top. It landed at 30m19s and got cancelled
    # while running out the last few crates.
    #
    # 45 covers that with room for a cold kache. The linux legs sit near 24min,
    # so this is headroom for them too rather than a licence to grow — if a leg
    # starts approaching it, find out what got slower.
    timeout-minutes: 45
    needs: gen
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64 (Native)
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux ARM64 (Native). ubuntu-24.04-arm is free for public repos and
          # is the only place aarch64-linux is exercised at all — the build job
          # cross-compiles it, so without this job the target shipped with no
          # test ever run against it. Pairs with darwin/arm64 to give the arch
          # axis coverage on both OSes rather than only on macOS.
          - os: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          # macOS ARM64 (Apple Silicon natively runs on macos-latest)
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo
          path: .

      # `tst` links a test binary per workspace crate; with the nix store and the
      # heavy dep graph this can exhaust the ~14 GB ubuntu-latest root disk mid-link
      # ("No space left on device"). Drop preinstalled toolchains this job never
      # uses to reclaim ~15 GB before the build. Linux only (paths are linux, and
      # the macOS runner is not disk-constrained here).
      - name: Free disk space (linux)
        if: matrix.os == 'linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix
        with:
          cargo-target: ${{ matrix.target }}
          cache-suffix: "-test"
          r2-secret: ${{ secrets.CF_SSCACHE }}

      # No macFUSE on the runner: the macOS binaries weak-link libfuse, so they
      # launch with the dylib absent. `support_check` finds no macfuse.fs and
      # reports Unavailable, so FUSE mount tests skip. Linux exercises the real
      # pure-Rust FUSE path.
      - name: Test
        shell: devenv shell bash -- -e {0}
        env:
          RUST_BACKTRACE: "1"
        run: tst

      # Also the upload barrier, which is why it is `always()` and why every
      # compiling job needs one. The daemon uploads to R2 in the background so
      # no rustc invocation waits on the network — but an ephemeral runner is
      # torn down the moment the job ends, taking any queued upload with it.
      # `daemon stop` drains the queue (up to 30s) before returning, so what
      # this job compiled is actually published. Without it the cache still
      # reads correctly, it just never fills.
      #
      # `|| true`: fork PRs run with no remote and therefore no daemon (see
      # setup-nix), and this must not turn a green build red on the way out.
      - name: kache stats + drain uploads
        if: always()
        shell: devenv shell bash -- -e {0}
        run: |
          kache stats

          # Resolve the log path from the daemon itself rather than hardcoding
          # it. Both OSes run this same step and they do not agree: Linux puts
          # it at `~/.cache/kache/kache.log`, macOS at
          # `~/Library/Logs/kache/kache.log` — note *Logs*, not the `Caches`
          # directory the upstream docs name, which is where hardcoding it
          # would have silently produced nothing on the darwin legs.
          log=$(kache daemon 2>/dev/null | awk '/^[[:space:]]*Logs:/ {print $2; exit}') || true

          kache daemon stop || true

          # Upload outcomes exist *only* in this log. `kache stats` reports what
          # was read, never what was published, so without this the difference
          # between "uploaded" and "still queued when the 30s drain cap fired"
          # is invisible — which is precisely the question a low hit rate on a
          # re-run raises, and which cost a round trip to answer once already.
          if [ -n "${log:-}" ] && [ -f "$log" ]; then
            echo "::group::kache daemon log (tail)"
            tail -n 200 "$log"
            echo "::endgroup::"
          else
            echo "::warning title=kache::daemon log not found at '${log:-<unresolved>}' — upload outcomes are not diagnosable for this job"
          fi

  # Compile `bin_e2e`'s test binaries ahead of the job that runs them. `tst`
  # excludes the crate (it needs staged artifacts to run) and nothing else in
  # the workspace depends on it, so its private dependencies — portable-pty,
  # vt100 — and the three test binaries are all `bin_e2e` has to compile after
  # downloading the artifacts, on the critical path to `release`.
  #
  # This job needs only `gen`, so it runs concurrently with `build` and `test`
  # and is long finished before `bin_e2e` starts. The kache store is shared
  # across jobs through R2, and the registry cache key is the same `-bin-e2e`
  # suffix, so
  # `bin_e2e` restores both and starts running tests instead of compiling.
  #
  # Its own job rather than a step in `test`: both compile the test profile, so
  # sharing a runner would mean sharing `target/debug`'s cargo lock and running
  # one after the other anyway.
  #
  # --no-run because the tests hard-fail without a dist. A compile error here is
  # a real failure — `bin_e2e` would hit the same one 20 minutes later.
  bin_e2e_warm:
    name: Warm Binary E2E ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    needs: gen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo
          path: .

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix
        with:
          cargo-target: ${{ matrix.target }}
          cache-suffix: "-bin-e2e"
          r2-secret: ${{ secrets.CF_SSCACHE }}

      - name: Compile test binaries
        shell: devenv shell bash -- -e {0}
        run: cargo test --locked -p bin-e2e --no-run

      # Also the upload barrier, which is why it is `always()` and why every
      # compiling job needs one. The daemon uploads to R2 in the background so
      # no rustc invocation waits on the network — but an ephemeral runner is
      # torn down the moment the job ends, taking any queued upload with it.
      # `daemon stop` drains the queue (up to 30s) before returning, so what
      # this job compiled is actually published. Without it the cache still
      # reads correctly, it just never fills.
      #
      # `|| true`: fork PRs run with no remote and therefore no daemon (see
      # setup-nix), and this must not turn a green build red on the way out.
      - name: kache stats + drain uploads
        if: always()
        shell: devenv shell bash -- -e {0}
        run: |
          kache stats

          # Resolve the log path from the daemon itself rather than hardcoding
          # it. Both OSes run this same step and they do not agree: Linux puts
          # it at `~/.cache/kache/kache.log`, macOS at
          # `~/Library/Logs/kache/kache.log` — note *Logs*, not the `Caches`
          # directory the upstream docs name, which is where hardcoding it
          # would have silently produced nothing on the darwin legs.
          log=$(kache daemon 2>/dev/null | awk '/^[[:space:]]*Logs:/ {print $2; exit}') || true

          kache daemon stop || true

          # Upload outcomes exist *only* in this log. `kache stats` reports what
          # was read, never what was published, so without this the difference
          # between "uploaded" and "still queued when the 30s drain cap fired"
          # is invisible — which is precisely the question a low hit rate on a
          # re-run raises, and which cost a round trip to answer once already.
          if [ -n "${log:-}" ] && [ -f "$log" ]; then
            echo "::group::kache daemon log (tail)"
            tail -n 200 "$log"
            echo "::endgroup::"
          else
            echo "::warning title=kache::daemon log not found at '${log:-<unresolved>}' — upload outcomes are not diagnosable for this job"
          fi

  # Black-box tests against the artifacts the `build` job just produced — the
  # exact bytes that get published. Covers only what `test` structurally cannot:
  # dlopen of the shipped plugin cdylibs, the TUI under a real PTY, and process
  # exit status. Runs `e2e`, the same script used locally; the only CI-specific
  # part is HEPH_E2E_FROM pointing at the downloaded artifacts.
  #
  # linux/arm64 matters most here: the build job cross-compiles it, so this is
  # the only place the shipped aarch64-linux binary is ever executed.
  bin_e2e:
    name: Binary E2E ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    # bin_e2e_warm is a hard dependency, not just an optimisation running
    # nearby: both jobs pay the same nix-store restore before compiling
    # anything, so on a run where `build` is mostly cache hits it can finish
    # first and this job would start while the warm is still going — compiling
    # the same crates concurrently, with neither seeing the other's objects.
    # Waiting makes the cache hit deterministic. The warm needs only `gen`, so
    # it is finished well before `build` on any run where `build` does work.
    needs: [gen, build, bin_e2e_warm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo
          path: .

      # Only this platform's artifacts: the std-flavour `heph_<os>_<arch>` (what
      # the `e2e` script stages as `dist/heph`), the debug-flavour
      # `heph_debug_<os>_<arch>` (downloaded too since it matches the glob, but
      # unused — the `e2e` script only picks up the exact std name), and the
      # `heph-*-plugin_<os>_<arch>.{so,dylib}` cdylibs. `heph-govet` carries no os/arch
      # suffix, so the pattern leaves it out.
      - name: Download artifacts under test
        uses: actions/download-artifact@v7
        with:
          pattern: heph*_${{ matrix.os }}_${{ matrix.arch }}*
          path: dist
          merge-multiple: true

      - name: Setup Nix + devenv
        uses: ./.github/actions/setup-nix
        with:
          cargo-target: ${{ matrix.target }}
          cache-suffix: "-bin-e2e"
          r2-secret: ${{ secrets.CF_SSCACHE }}

      - name: E2E
        shell: devenv shell bash -- -e {0}
        env:
          RUST_BACKTRACE: "1"
          HEPH_E2E_FROM: dist
        run: e2e

      # Also the upload barrier, which is why it is `always()` and why every
      # compiling job needs one. The daemon uploads to R2 in the background so
      # no rustc invocation waits on the network — but an ephemeral runner is
      # torn down the moment the job ends, taking any queued upload with it.
      # `daemon stop` drains the queue (up to 30s) before returning, so what
      # this job compiled is actually published. Without it the cache still
      # reads correctly, it just never fills.
      #
      # `|| true`: fork PRs run with no remote and therefore no daemon (see
      # setup-nix), and this must not turn a green build red on the way out.
      - name: kache stats + drain uploads
        if: always()
        shell: devenv shell bash -- -e {0}
        run: |
          kache stats

          # Resolve the log path from the daemon itself rather than hardcoding
          # it. Both OSes run this same step and they do not agree: Linux puts
          # it at `~/.cache/kache/kache.log`, macOS at
          # `~/Library/Logs/kache/kache.log` — note *Logs*, not the `Caches`
          # directory the upstream docs name, which is where hardcoding it
          # would have silently produced nothing on the darwin legs.
          log=$(kache daemon 2>/dev/null | awk '/^[[:space:]]*Logs:/ {print $2; exit}') || true

          kache daemon stop || true

          # Upload outcomes exist *only* in this log. `kache stats` reports what
          # was read, never what was published, so without this the difference
          # between "uploaded" and "still queued when the 30s drain cap fired"
          # is invisible — which is precisely the question a low hit rate on a
          # re-run raises, and which cost a round trip to answer once already.
          if [ -n "${log:-}" ] && [ -f "$log" ]; then
            echo "::group::kache daemon log (tail)"
            tail -n 200 "$log"
            echo "::endgroup::"
          else
            echo "::warning title=kache::daemon log not found at '${log:-<unresolved>}' — upload outcomes are not diagnosable for this job"
          fi

  # Perf-regression check (own workflow: .github/workflows/perf.yml) —
  # generates one synthetic corpus, times a fixed scenario set against N and
  # N-1, and reports a regression verdict. Two triggers, two roles:
  #   - `pull_request`, labeled `perf-test`: this is the GATE — a real
  #     regression fails the check for real. Opt-in while the harness and its
  #     thresholds are still being proven out; an unlabeled PR skips this job
  #     entirely rather than running it just to fail on the missing label —
  #     cheaper, and the `if:` below is the single source of truth for
  #     whether perf runs at all. Adding the label to an already-open PR does
  #     NOT retrigger this job on its own (`pull_request` only fires on
  #     `opened`/`synchronize`/`reopened`, not `labeled`) — push a commit or
  #     re-run the job after labeling.
  #   - `push` to `master`: nothing is blocked at this point (the merge
  #     already happened) — this is continuous monitoring, and a regression
  #     instead files a GitHub issue.
  # Split into its own workflow file because its cost (real runners, a
  # generated corpus, real timing) and its release-fetching/issue-filing
  # logic are large enough to read on their own, separate from the
  # compile/lint/test jobs here. Called only when needed — skipped entirely
  # outside those two triggers, rather than queued and no-op'd — and only
  # after `build` has published this run's `heph`/`heph-bench`/go-plugin
  # artifacts, which the called workflow downloads by pattern from this same
  # run. See perf.yml for the full design (tiers, baseline resolution,
  # concurrency policy, PostHog, issue filing).
  perfbench:
    name: Perf
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-test')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [build]
    uses: ./.github/workflows/perf.yml
    secrets: inherit

  release:
    name: Release
    needs: [gen, upload_artifacts, lint, test, bin_e2e]
    if: github.ref == 'refs/heads/master'
    # Build/test run concurrently for every master commit (see top-level
    # concurrency), but only the latest landed commit should ever mark a
    # release as production. Shared group + cancel-in-progress means an older
    # commit's release job is cancelled the moment a newer commit's reaches
    # this point, so the newest always wins.
    concurrency:
      group: release-master
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update Release to Production
        uses: softprops/action-gh-release@v3
        with:
          repository: hephbuild/heph-artifacts-v1
          token: ${{ secrets.HEPH_ARTIFACTS_PAT }}
          tag_name: ${{needs.gen.outputs.version}}
          prerelease: false
          make_latest: true

      - name: Trigger Deploy on hephbuild.github.io
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.HEPH_ARTIFACTS_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'hephbuild',
              repo: 'hephbuild.github.io',
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                version: '${{ needs.gen.outputs.version }}',
              },
            });

  summary:
    name: Summary
    needs: [gen, upload_artifacts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{needs.gen.outputs.version}}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.upload_artifacts.result }}" == "success" ]; then
            echo "**Release:** [${{needs.gen.outputs.version}}](${{needs.upload_artifacts.outputs.release_url}})" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.upload_artifacts.result }}" == "skipped" ]; then
            echo "**Release:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Release:** Failed or cancelled" >> $GITHUB_STEP_SUMMARY
          fi

  cleanup:
    name: Cleanup
    needs: [gen, build, lint, test, bin_e2e, upload_artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete Repo Artifact
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: "${{ needs.gen.outputs.repo_artifact_id }}",
            });
