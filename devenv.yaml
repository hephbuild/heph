inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Go alone, from upstream nixpkgs, so the Go version moves without re-resolving
  # the rest of the shell (see `go` in devenv.nix).
  #
  # The stable channel, not nixpkgs-unstable: a release branch backports Go's
  # patch releases (security fixes included) and had go 1.27.4 while unstable
  # still had 1.27.3. A stable branch does not take a new Go *minor*, though:
  # moving to the next one may mean pointing this back at nixpkgs-unstable, or
  # at the next nixos-YY.MM.
  nixpkgs-go:
    url: github:NixOS/nixpkgs/nixos-26.05
